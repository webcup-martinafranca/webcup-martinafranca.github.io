one, MVP del match, capace di dare ritmo e qualità alla manovra offensiva. A segno anche Sufka, mentre per lo Ziwoondello arriva il gol della bandiera firmato da Caroli P.", "Nel finale dilaga definitivamente il Mai in Forma con le doppiette di Camassa e Pulito, che fissano il risultato sull’11-1.", "Una batosta pesante per lo Ziwoondello, apparso stanco e incapace di reggere i ritmi elevati del torneo. Di contro, il FC Mai in Forma vola sulle ali dell’entusiasmo: il girone di ritorno si preannuncia più acceso che mai."]}, {"id": 38, "t": "REAL MADRINK dilaga contro TITANIUM!", "img": "https://f2x9b.emailsp.com/documenti/1/COMUNICAZIONI%20IG%20(32).jpg", "meta": "🏆 WEB CUP 2026 – UNDER2ª GIORNATA | 28/03/2026 ore 17:00TITANIUM TEAM – REAL MADRINK 3-9", "data": "28/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Dopo le sconfitte all’esordio, entrambe le squadre scendono in campo con grande voglia di riscatto. Parte meglio il REAL MADRINK, che sblocca subito il match con il suo bomber Massafra.", "L’inizio è piuttosto disordinato da entrambe le parti, ma è il TITANIUM TEAM a trovare il pareggio con Lecini. Un equilibrio solo momentaneo: i TITANIUM appaiono poco compatti, con reparti troppo distanti, mentre il REAL MADRINK prende campo e fiducia, organizzandosi al meglio sotto la guida di Marangi P.", "La superiorità si concretizza già nel primo tempo, con Massafra che cala il tris personale e indirizza la gara. Nella ripresa Colucci S. prova a riaccendere le speranze del TITANIUM, ma è solo un’illusione: Marangi ristabilisce subito le distanze.", "Nel cuore del secondo tempo si scatena ancora l’MVP del match Massafra, che firma altri tre gol chiudendo definitivamente i giochi. Il REAL MADRINK dilaga: vanno a segno anche Marangi A. (doppietta) e Mastrovito.", "Nel finale Caroli trova almeno il gol della bandiera per il TITANIUM TEAM, ma il passivo resta pesante.", "Il REAL MADRINK si rilancia così in classifica con una prestazione convincente. Ora pausa pasquale, poi si tornerà in campo"]}, {"id": 39, "t": "I GIALLOBLU si prendono la testa della classifica!COMO K.O", "img": "https://f2x9b.emailsp.com/documenti/1/COMUNICAZIONI%20IG(0).jpg", "meta": "🏆 WEB CUP 2026 – UNDER 2ª GIORNATA | 28/03/2026 ore 16:00COMO – TEAM GIALLOBLU 5-7", "data": "28/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Match subito accesissimo, con ritmi alti e occasioni da entrambe le parti fin dai primi minuti. Dopo una fase iniziale di equilibrio, è il TEAM GIALLOBLU a colpire per primo: Carovigno è il più rapido di tutti sul tap-in e firma l’1-0.", "Il COMO però reagisce immediatamente, trascinato da capitan Basile. A salire in cattedra è soprattutto D’Onghia A., autentico protagonista della prima fase di gara, che con una splendida doppietta ribalta il risultato. L’inerzia sembra tutta dalla parte del COMO, che allunga anche sul 3-1 grazie all’ottimo impatto nel torneo di Iudici.", "Quando il match sembra indirizzato, sale in cattedra il capitano del TEAM GIALLOBLU, Conte, che risponde colpo su colpo e firma una doppietta che ristabilisce la parità. La partita resta bellissima, intensa ed equilibrata.", "Nella ripresa però cambia qualcosa: l’incisività del TEAM GIALLOBLU e la grande prestazione del portiere Natola fanno la differenza. Palazzo riporta avanti i suoi, poi è Gentile a prendersi la scena con una doppietta pesantissima che indirizza definitivamente il match.", "Il COMO prova a rientrare con Carrieri, che segna un gran gol riaccendendo le speranze, ma trova sulla sua strada un super Santoro, MVP della gara, decisivo nel blindare il risultato.", "Nel finale Granaldi accorcia ancora, ma è troppo tardi: il TEAM GIALLOBLU vince 7-5, convince e vola a punteggio pieno con 6 punti.", "Per il COMO arriva una battuta d’arresto dopo un avvio promettente. Ora pausa pasquale, poi si tornerà in campo per l’ultima giornata del girone d’andata."]}, {"id": 40, "t": "MAI IN FORMA tira fuori i muscoli!PSG lotta, ma si arrende!", "img": "https://f2x9b.emailsp.com/documenti/1/COMUNICAZIONI%20IG%20(31).jpg", "meta": "🏆 WEB CUP 2026 – OVER 502ª GIORNATA | 27/03/2026 ore 20:00FC MAI IN FORMA-PARIS SAINT GENNAR 5-2", "data": "27/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Match attesissimo e carico di significato quello tra FC Mai in Forma e Paris Saint Gennar, due squadre scese in campo con un solo obiettivo: conquistare punti pesanti per la qualificazione.", "Fin dalle prime battute si capisce che la serata sarà diversa dal solito per il PSG, chiamato a confrontarsi con una squadra solida, determinata e ben organizzata.", "A rompere l’equilibrio è uno dei nuovi innesti: Camassa, che si inserisce alla perfezione e sblocca il match. La gara è intensa, ricca di duelli a centrocampo, ma sempre giocata nel massimo rispetto: grande esempio di fair play da entrambe le squadre.", "FC Mai in Forma continua a spingere e trova il raddoppio con Nigri, protagonista di una prestazione solida e concreta. Il PSG prova a reagire, ma trova davanti a sé un Vinci in versione insuperabile: tra i pali è un vero muro.", "Ancora Camassa protagonista: arriva il tris e la sua doppietta personale che indirizza fortemente il match.", "Nella ripresa il PSG prova a rientrare in partita con Calella, che accorcia le distanze. Ma la risposta è immediata: il nuovo volto Taldone firma il 4-1 e ristabilisce il gap.", "Il copione non cambia: PSG più propositivo, tanti tiri, ma Vinci continua a dire no a tutto. Nel finale è ancora Calella a trovare il gol del 4-2, riaccendendo una flebile speranza.", "Il PSG si sbilancia nel tentativo del tutto per tutto, ma viene punito in contropiede: Pulito chiude definitivamente i giochi con il 5-2.", "Situazione apertissima nel girone: entrambe le squadre restano a quota 3 punti, con ancora tanto in palio a una giornata dal termine del girone d’andata."]}, {"id": 41, "t": "FC CATENACCIO  a punteggio pieno!DCF ZIWONDELLO k.o", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/COMUNICAZIONI%20IG%20(30).jpg", "meta": "🏆 WEB CUP 2026 – OVER 502ª GIORNATA | 27/03/2026 ore 20:00FC CATENACCIO - DCF WIWOONDELLO 8-1", "data": "27/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Parte in equilibrio la sfida della seconda giornata, con poche occasioni e ritmi inizialmente contenuti. A rompere il ghiaccio è Conserva, che alla sua prima apparizione in manifestazione trova subito il gol del vantaggio.", "Il raddoppio porta la firma del solito Castellana V., che con una serpentina chiude con un elegante tocco sotto beffando Melambo. Da lì in poi il match prende una direzione chiara: Campanella cala il tris, mentre tra i pali Narcisi si rende protagonista con interventi decisivi che spengono ogni tentativo degli avversari.", "Nella ripresa è ancora Castellana V. a colpire, firmando il 4-0. Ziwoondello prova a reagire con il capitano Caroli R., che segna il primo gol della sua WEB CUP 2026, ma è solo un lampo.", "La risposta del FC Catenaccio è immediata: Conserva ristabilisce le distanze e Castellana V., in stato di grazia, chiude i conti con una doppietta. Il sigillo finale arriva ancora da Campanella, a pochi secondi dal triplice fischio.", "FC Catenaccio vola nel girone A, mentre Ziwoondello resta fanalino di coda.", "Siamo solo alla seconda giornata… ma lo spettacolo è appena iniziato"]}, {"id": 42, "t": "NET AMBIENTE vince e convice, vola in testa!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/COMUNICAZIONI%20IG(3).jpg", "meta": "🏆 WEB CUP 2026 – OVER 502ª GIORNATA | 22/03/2026 ore 09:30NET AMBIENTE - ZEBRAS 8-4", "data": "22/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "over50", "p": ["Ultimo match della seconda giornata che non delude le aspettative e regala spettacolo ed emozioni!", "NET AMBIENTE parte forte, facendo valere sin dai primi minuti il proprio peso offensivo e impegnando più volte il portiere avversario.", "A sbloccare il match è il capitano Bello, che con un destro preciso porta avanti i gialli.", "La risposta degli ZEBRAS non tarda ad arrivare ed è affidata al solito Caramia, che prima firma il pareggio e poi, con una giocata personale straordinaria, completa il sorpasso.", "La gara resta viva e combattuta: NET AMBIENTE trova il pari con Montanaro, che poco dopo firma anche il nuovo vantaggio. Gli ZEBRAS però restano agganciati grazie alla giocata di Tagliente, che riporta il punteggio in equilibrio.", "Nel momento più delicato, nonostante gli stop fisici di Lisi e dello stesso Bello, NET AMBIENTE trova la forza di reagire ancora con uno scatenato Montanaro, protagonista assoluto e autore della rete del nuovo sorpasso.", "Da lì in poi cambia l’inerzia del match: gli ZEBRAS accusano la stanchezza, mentre sale in cattedra Serio, decisivo con una prestazione dominante. Segna, serve assist e chiude di fatto la partita insieme a Braccioforte. Nel finale è ancora Serio show, con altre due reti e giocate spettacolari, mentre Tagliente rende meno pesante il passivo con la sua doppietta.", "Situazione girone:NET AMBIENTE vola a punteggio pieno dopo due giornate, confermandosi tra le squadre più in forma del torneo.ZEBRAS, fermi a un punto, dovranno reagire subito per restare in corsa qualificazione."]}, {"id": 43, "t": "Il Ruggito dei campioni!REDS battono CAROLI!", "img": "https://f2x9b.emailsp.com/documenti/1/COMUNICAZIONI%20IG%20(8)(0).jpg", "meta": "🏆 WEB CUP 2026 – OVER 502ª GIORNATA | 22/03/2026 ore 08:30RED DEVILS 7-6 CAROLI ELETTRONICA", "data": "22/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "over50", "p": ["Primo match della domenica ed è subito spettacolo puro. Un vero revival della finale 2025 che non delude le aspettative, regalando una gara intensa, equilibrata e combattuta fin dai primi minuti.", "Sono i RED DEVILS a partire forte: CHIEPPA sfonda sulla fascia e serve MARINUZZI, che con un tap-in porta subito avanti i suoi. Il vantaggio dura però pochissimo, perché LACATENA sale subito in cattedra e ristabilisce la parità. Ancora protagonista CHIEPPA, autore di una prestazione straordinaria, che si libera e lascia partire un destro preciso per il 2-1.", "La gara resta aperta e combattuta: i REDS contengono le offensive di ALBANESE e LACATENA, mentre LACIRIGNOLA impegna più volte CARBOTTI, sempre attento tra i pali. Ancora una percussione di CHIEPPA libera BASILE davanti alla porta per il 3-1 e, poco dopo, lo stesso CHIEPPA sorprende ZITO direttamente da calcio d’angolo per il 4-1.", "Nel finale di primo tempo arriva però la reazione di CAROLI ELETTRONICA: doppietta di LACATENA su assist di ALBANESE che riporta il risultato sul 4-2, lasciando aperto ogni scenario.", "Nella ripresa SCIALPI, poi eletto MVP del match, ristabilisce le distanze portando i RED DEVILS sul 5-2 grazie a una prestazione fatta di ordine e sacrificio. Ma i finalisti della scorsa edizione non mollano: ALBANESE accorcia con un gran gol e pochi minuti dopo il capitano DI BARI riapre definitivamente la gara sul 5-4.", "Nel momento migliore di CAROLI è ancora CHIEPPA a trovare la giocata decisiva, segnando un gol fondamentale. La risposta è immediata: ALBANESE segna ancora e tiene la partita completamente aperta. A dieci minuti dal termine è assedio CAROLI, con CARBOTTI che si supera in più occasioni mantenendo in vita i suoi.", "La pressione trova il suo premio quando ALBANESE, con grinta e determinazione, completa la sua tripletta firmando il 6-6.", "Quando tutto sembra indirizzato verso il pareggio, nei secondi finali arriva l’episodio decisivo: da calcio d’angolo CHIEPPA trova il perfetto movimento di BASILE, che realizza il definitivo 7-6.", "Una partita straordinaria per aprire la domenica, con entrambe le squadre protagoniste di uno spettacolo di altissimo livello. I RED DEVILS conquistano tre punti fondamentali per rilanciarsi, mentre CAROLI ELETTRONICA fatica ancora a ingranare, anche se siamo solo alla seconda giornata e il torneo è ancora lungo."]}, {"id": 44, "t": "BASILE trascina il COMO, sconfitto il REAL MADRINK!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/COMUNICAZIONI%20IG%20(1)(0).jpg", "meta": "🏆 WEB CUP 2026 – UNDER | 1ª GIORNATA21/03/2026 ore 17:00COMO – REAL MADRINK 7-4", "data": "21/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Match intenso e ricco di emozioni quello che chiude la prima giornata della categoria Under, con due squadre organizzate e determinate a partire subito forte.", "A sbloccare la gara è il capitano Basile, che con un destro potentissimo sotto l’incrocio firma l’1-0, confermandosi protagonista anche in questa edizione. Il Real Madrink però non si lascia intimorire e reagisce immediatamente con Mastrovito, che ristabilisce l’equilibrio.", "Il Como spinge, ma trova davanti a sé un ottimo Conserva, decisivo tra i pali. Serve allora ancora Basile per riportare avanti i suoi. La gara cambia però volto: il Como si abbassa troppo e il Real Madrink ne approfitta. Con Marangi a dettare i tempi, è Massafra a salire in cattedra: prima trova il pari, poi completa il sorpasso sul 3-2 e poco dopo cala anche il poker personale per il momentaneo 4-2.", "Nella ripresa il Como entra con un altro spirito. A riaccendere la partita è D’Onghia A., che accorcia le distanze e riporta fiducia. Da lì in poi è un monologo: Granaldi trova il 4-4 con un preciso palo-gol, poi sale in cattedra Carrieri, autore di una doppietta devastante in pochi minuti che ribalta completamente l’inerzia del match.", "A chiudere i conti ci pensa ancora lui, Basile, che firma la tripletta personale e il definitivo 7-4.", "Una partita spettacolare, giocata a viso aperto da entrambe le squadre, ma decisa nel finale dalla maggiore brillantezza del Como. Grande equilibrio e ottimo esordio per tutte e due le formazioni!"]}, {"id": 45, "t": "PSG Straripante!Ziwoondello K.O", "img": "https://f2x9b.emailsp.com/documenti/1/COMUNICAZIONI%20IG%20(6).jpg", "meta": "🏆 WEB CUP 2026 – UNDER1ª GIORNATA | 21/03/2026 ore 16:00PARIS SAINT GENNAR 6 - 1 ZIWOONDELLO", "data": "21/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Buona la prima per il Paris Saint Gennar, nuova realtà della WEB CUP 2026, che si presenta con un netto successo contro uno Ziwoondello reduce dal 4° posto della scorsa edizione.", "L’inizio è intenso e combattuto, con ritmi alti da entrambe le parti. L’equilibrio dura però appena 7 minuti: è D’Amico a sbloccare il match, dando il via allo show PSG.", "Da lì in poi i “ragazzi terribili” prendono il controllo totale: qualità, velocità e ottime trame offensive portano rapidamente al doppio vantaggio con Calella e al tris firmato Scialpi.", "Ziwoondello prova a reagire, ma il Paris Saint Gennar domina in ogni fase: costruzione, gestione e recupero palla. Nella ripresa arrivano anche il gol del capitano Santorsola e la doppietta di Pastore, che chiude definitivamente i conti sul 6-0.", "Nel finale, però, c’è spazio anche per l’emozione: Bello torna al gol dopo quasi un anno di stop, regalando allo Ziwoondello il punto dell’orgoglio.", "Partita a senso unico, ma siamo solo all’inizio: la WEB CUP 2026 promette spettacolo"]}, {"id": 46, "t": "FUORI PORTA spengono le fiamme dei FIRE PRO!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/COMUNICAZIONI%20IG%20(4)(0).jpg", "meta": "🏆 WEB CUP 2026 – OVER 502ª GIORNATA | 21/03/2026 ore 15:00FUORI PORTA 5-1 FIRE PRO", "data": "21/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "over50", "p": ["Anticipo della seconda giornata che mette di fronte due squadre reduci da esordi opposti. I FIRE PRO, oggi in emergenza tra infortuni e assenze, si affidano a SERGIO tra i pali, protagonista di un’ottima prestazione.", "L’avvio è equilibrato: nei primi 15 minuti regna lo 0-0, con i portieri assoluti protagonisti.", "A sbloccare il match è FRAGNELLI (MVP) al 18’, su assist di CAROVIGNO, premiando il possesso palla insistente dei FUORI PORTA. Poco dopo entra MINARDI che cambia la partita: prima firma il 2-0, poi cala il tris personale chiudendo di fatto la prima frazione sul 3-0.", "Nella ripresa i FIRE PRO accusano la stanchezza, complice anche l’assenza di cambi, mentre i FUORI PORTA gestiscono e dilagano: in gol anche il capitano COLUCCI D. e COLUCCI S. per il momentaneo 5-0.", "Nel finale arriva il gol della bandiera di TALDONE che fissa il risultato sul 5-1.", "Vittoria netta per FUORI PORTA, ma entrambe le squadre si ritrovano ora a quota 3 punti in classifica."]}, {"id": 47, "t": "FC CATENACCIO vince all'esordio!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/COMUNICAZIONI%20IG%20(16).jpg", "meta": "🏆 1^GIORNATA - UNDER 19\\03/2026 ore 21:00FC CATENACCIO - FC MAI IN FORMA 5-4", "data": "19/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Secondo match di giornata e debutto assoluto per entrambe le squadre, con FC Catenaccio che presenta però diversi volti già noti alla WEB CUP.", "L’avvio è equilibrato: poche vere occasioni da gol, ma tanta intensità e continui contrasti a metà campo. A rompere gli equilibri è Castellana V., che si inventa una splendida serpentina e porta avanti i suoi.", "La reazione di Mai in Forma non tarda ad arrivare: Desiati lascia partire un gran destro che vale il pareggio. La partita si accende, tra duelli fisici, contrasti duri e qualche momento di tensione di troppo, con scene che sarebbe meglio non vedere in campo.", "Si torna a giocare e Carbotti firma il 2-1 con un sinistro preciso all’angolino. Sembra il momento giusto per il Catenaccio, ma in pochi minuti cambia tutto: Nigri, Pulito e Lisi ribaltano il match con tre gol consecutivi. Da 2-1 a 2-4 in un attimo.", "Il Catenaccio accusa il colpo, ma trova nel suo leader la forza per reagire: ancora Castellana V., MVP del match, accorcia sul 3-4. Poi è Campanella a firmare il pareggio, prima del sigillo finale, ancora di Castellana V., che completa la rimonta per il definitivo 5-4.", "Mai in Forma lotta fino all’ultimo secondo senza mai mollare, ma il pari non arriva.", "Una gara bella, maschia e combattuta, che conferma il carattere di entrambe le squadre: pronte a dire la loro in questa WEB CUP"]}, {"id": 48, "t": "TEAM GIALLOBLU affonda TITANIUM!", "img": "https://f2x9b.emailsp.com/documenti/1/COMUNICAZIONI%20IG%20(15).jpg", "meta": "🏆 1^GIORNATA - UNDER 19\\03/2026 ore 20:00TEAM GIALLOBLU - TITANIUM TEAM 6-3", "data": "19/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "under", "p": ["Esordio alla WEB CUP 2026 per i Titanium Team, subito chiamati a misurarsi contro un Team Gialloblu rinnovato e rinforzato dopo la mancata qualificazione dello scorso anno.", "La gara parte su ritmi equilibrati, ma a sbloccarla sono proprio i gialloblu: il nuovo acquisto Di Giuseppe non trema dal dischetto e firma l’1-0. Poco dopo è Gentile, autentico protagonista della serata, a trovare il raddoppio con grande freddezza.", "Il Titanium fatica inizialmente a trovare ritmo e geometrie, ma riesce a rientrare in partita grazie a una giocata di altissimo livello: Salamina A. lascia partire un destro sotto l’incrocio che vale il 2-1 e riaccende il match. L’entusiasmo però viene subito frenato dal Team Gialloblu, che allunga ancora con Gentile e con il capitano Conte, portandosi sul 4-1.", "Nella ripresa cambia tutto. Il Titanium entra in campo con un altro atteggiamento, trascinato dall’energia e dalla qualità di Colucci, il cui ingresso si rivela decisivo: doppietta personale e partita riaperta sul 4-3.Nonostante le tante occasioni create, i gialloblu trovano in Natola un vero e proprio muro: il portiere si supera in più interventi decisivi e viene meritatamente premiato come MVP.", "Nel momento più delicato, però, sale ancora in cattedra Gentile: due gol nel finale che completano il suo poker personale e chiudono definitivamente i conti sul 6-3.", "Una gara intensa, combattuta e ricca di emozioni: segnali chiari che questo girone sarà tutt’altro che semplice da conquistare."]}, {"id": 49, "t": "Botta e risposta CAROLI-ZEBRAS 8-8!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/COMUNICAZIONI%20IG(0).jpg", "meta": "🏆 1^GIORNATA - Over5015\\03/2026 ore 09:30CAROLI ELETTRONICA - ZEBRAS 8-8", "data": "15/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "over50", "p": ["Match spettacolare e ricco di emozioni quello tra Caroli Elettronica e Zebras, che si chiude con un pirotecnico 8-8.", "Partono fortissimo gli Zebras con il loro capitano Caramia, subito a segno anche in questa edizione della WEB CUP. Poco dopo arriva il raddoppio firmato Olivieri, in gran forma, che dopo circa dieci minuti porta i suoi sul 2-0.", "La reazione di Caroli Elettronica arriva grazie al solito Lacatena, che riapre il match e suona la carica per i suoi. Nella prima frazione però gli Zebras sembrano avere qualcosa in più: Tagliente, con il suo sinistro velenoso, ristabilisce le distanze.", "A quel punto sale in cattedra ancora Caramia, vero mattatore di giornata, che mette a segno altri due gol portando il risultato sul 5-1. Caroli però non molla e si affida all’esperienza di Albanese, che prende in mano il gioco della squadra.", "Quando ancora Caramia firma il suo quarto gol personale per il 6-2, la partita sembra indirizzata. Ma l’orgoglio di Palese riaccende la sfida: doppietta e punteggio che torna sul 6-4.", "L’inerzia cambia completamente. Ancora Lacatena prima trova un gran gol e poi, dal dischetto, firma il pareggio sul 6-6.", "Da lì in avanti la gara diventa intensissima: squadre lunghe, continui ribaltamenti di fronte e occasioni da entrambe le parti. Caramia, sugli sviluppi di un calcio d’angolo e con una deviazione decisiva, trova addirittura il suo quinto gol personale. Ma Lacirignola risponde con un gran destro che vale il meritato pareggio.", "Nel finale Olivieri sembra regalare i tre punti agli Zebras con la rete dell’8-7. Ma negli ultimi minuti il capitano Di Bari, ultimo a mollare, trova il gol dell’8-8 che fissa il risultato finale.", "Un match bellissimo, intenso e ricco di gol: il livello della WEB CUP Over 50 quest’anno si è senza dubbio alzato."]}, {"id": 50, "t": "I FIRE PRO domano le fiamme dei REDS!", "img": "https://f2x9b.emailsp.com/documenti/1/WhatsApp%20Image%202026-03-15%20at%2016.20.25.jpeg", "meta": "🏆 1^GIORNATA - Over5015\\03/2026 ore 08:30FIRE PRO - RED DEVILS 10-7", "data": "15/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "over50", "p": ["Match spettacolare nella categoria Over50 della WEB CUP 26 tra RED DEVILS e FIRE PRO, terminato con il successo dei FIRE PRO per 10-7 al termine di una gara ricca di colpi di scena.", "Partono forte FIRE PRO che trovano subito il vantaggio con Semeraro F. autore di un gran destro da vero veterano.", "La reazione dei RED DEVILS però è immediata: Ruggieri suona la carica e il capocannoniere della scorsa edizione Chieppa si scatena con due potenti conclusioni che ribaltano il punteggio sul 3-1. Ottimo anche l’impatto di Occhinegro, che prima serve un assist geniale per Chieppa e poi trova anche la via del gol portando i Reds sul 4-1.", "Quando la gara sembra indirizzata, Semeraro F. riapre tutto e poco dopo arriva l’episodio che cambia la partita: Chieppa viene ammonito per proteste, esce dal campo e decide di non rientrare più. I RED DEVILS perdono così riferimenti offensivi e i FIRE PRO ne approfittano immediatamente. Prima Fumarola accorcia le distanze, poi Semeraro G. “Lo Squalo” ristabilisce la parità.", "Con l’inerzia ormai cambiata, i FIRE PRO continuano a spingere: Fumarola firma la sua doppietta personale e poi sale in cattedra l’ex Santoro, autore di tre reti consecutive che mettono il risultato in cassaforte.", "Nel finale i campioni in carica provano con orgoglio a rientrare in partita grazie alle reti di Marinuzzi e Venere, ma a spegnere definitivamente le speranze ci pensa ancora Semeraro F, MVP della gara, che sigla il nono gol dei FIRE PRO. Nel recupero c’è tempo per un’ultima rete per parte con Semeraro G. e Venere M. che completano le loro doppiette personali.", "Finisce 10-7 per i FIRE PRO: un esordio spettacolare che promette una stagione Over50 combattuta fino all’ultimo."]}, {"id": 51, "t": "NET AMBIENTE C'è!", "img": "https://f2x9b.emailsp.com/documenti/1/WhatsApp%20Image%202026-03-14%20at%2019.21.06.jpeg", "meta": "🏆 1^GIORNATA - Over5014/03/2026 ore 15:0NET AMBIENTE vs FUORI PORTA 4-3", "data": "14/03/2026", "anno": "2026", "comp": "WEB CUP", "cat": "over50", "p": ["Esordio infuocato alla WEB CUP 2026 categoria Over 50, con una gara intensa e ricca di emozioni. Ritmo alto, belle giocate e tanto agonismo, a tratti anche sopra le righe, a dimostrazione di quanto entrambe le squadre tengano a partire con il piede giusto.La partita si sblocca grazie a uno degli “ex” di giornata, Braccioforte, che porta avanti NET AMBIENTE. La risposta di FUORI PORTA però è immediata e arriva con Colucci M., il migliore dei suoi, che ristabilisce subito la parità.Il match resta equilibrato e combattuto, ma è ancora Braccioforte (MVP) a riportare avanti NET AMBIENTE con un’altra giocata decisiva. Pochi minuti dopo si iscrive al tabellino anche Carovigno, con un gol da vero bomber che riporta nuovamente la gara in equilibrio.FUORI PORTA prova a costruire gioco con pazienza e buon giro palla, ma sembra mancare sempre l’ultimo tocco per colpire davvero. Ci pensa ancora Colucci M. che, da difensore solido, si trasforma in bomber puro e firma il sorpasso portando i suoi per la prima volta in vantaggio.NET AMBIENTE però non ci sta e, con energie fresche dalla panchina, torna a spingere. Il meritato pareggio arriva con un gran gol di Lucarella, che riaccende completamente la partita.L’episodio più discusso del match arriva poco dopo. Su un contrasto di gioco molto contestato, il direttore di gara Capinera lascia proseguire e l’azione si conclude con il potente destro di Rocchetti, che firma il definitivo 4-3 per NET AMBIENTE.Finale acceso e polemiche a non finire, ma il risultato non cambia. NET AMBIENTE, da outsider, tira fuori carattere e qualità conquistando i primi tre punti della WEB CUP.La domanda ora è una sola: sarà la vera sorpresa di questa WEB CUP?"]}, {"id": 52, "t": "HG FIVE CAMPIONI ASSOLUTI!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(27).jpg", "meta": "🏆 FINALISSIMA - Under25/05/2025 ore 19:30HG FIVE - IL PICCOLO PRINCIPE 3-33-2 (D.c.r.)", "data": "25/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Una finale spettacolare, che ha regalato tutto ciò che ci si aspettava da due vere corazzate del torneo. Giocate da applausi, gol ed emozioni fino all’ultimo secondo. HG FIVE e IL PICCOLO PRINCIPE si sono sfidate a viso aperto con un solo obiettivo: alzare la coppa più ambita!", "Nonostante l’assenza dell’infortunato PALMISANO, l’imbattuta HG FIVE trova subito il vantaggio grazie a un ispirato D’ONGHIA, che si prende la scena con un gol da rapace d’area. Ma la risposta del Piccolo Principe è immediata: ci pensa SALAMINA ALESSANDRO a riportare tutto in equilibrio con una conclusione precisa nel sette.", "Nel secondo tempo l’equilibrio si rompe: schema da fallo laterale e SALAMINA DONATELLO firma il sorpasso (2-1). Ma la reazione dell’HG FIVE è da grande squadra: magia di MARTUCCI, che salta l’uomo e buca il primo palo per il 2-2.", "Quando il match sembra avviarsi ai rigori, ecco che CERVELLERA illumina con una punizione delle sue, portando l'HG FIVE sul 3-2. Ma lI Piccolo Principe non molla mai e, su punizione, un rimpallo favorisce DIWOUTA per il definitivo 3-3.", "Ai calci di rigore è subito colpo di scena: l’MVP e Pallone d’Oro del torneo MARANGI DOMENICO colpisce la traversa.", "L’HG FIVE è perfetta dal dischetto con D’ONGHIA, MICOLI e MARTUCCI, mentre per il Piccolo Principe segnano SALAMINA D. e DIWOUTA.", "HG FIVE è campione della WEB CUP 2025 Under!", "Squadra fortissima, un gruppo unito e sempre corretto in campo: un trionfo meritato.", "Onore al Piccolo Principe, protagonista assoluto di questa edizione: sfortunati ai rigori, ma autori di un percorso da grandi.", "Una finale che resterà negli occhi e nel cuore di tutti."]}, {"id": 53, "t": "RED DEVILS CAMPIONI!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(25).jpg", "meta": "🏆 FINALISSIMA - Over5025/05/2025 ore 18:30RED DEVILS vs CAROLI ELETTRONICA", "data": "25/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Ultimo atto della terza edizione della WEB CUP 2025, categoria Over 50: in campo per il titolo i RED DEVILS, outsider terribili del torneo, contro CAROLI ELETTRONICA, alla seconda finale consecutiva.", "La sfida parte con qualche minuto di ritardo, e forse il prolungato riscaldamento gioca un brutto scherzo ai REDS, che subiscono l’iniziativa degli avversari. È il capitano DI BARI a rompere l’equilibrio e portare subito in vantaggio Caroli con una zampata delle sue.", "I RED DEVILS però non si lasciano travolgere e, con una rapida incursione, SCIALPI riporta tutto in parità, riaccendendo le speranze e gli animi in panchina.", "Da lì in poi, inizia lo CHIEPPA show: il bomber, già capocannoniere del torneo con 19 gol, prende per mano la squadra e sigla una doppietta devastante che porta il risultato sul 3-1, tagliando le gambe a una Caroli apparsa meno brillante rispetto al cammino precedente.", "A chiudere definitivamente i giochi ci pensa VENERE, che sceglie il momento migliore per sbloccarsi: il suo eurogol al volo è una perla che vale il 4-1 e fa esplodere la festa REDS. Non è ancora finita, perché CHIEPPA mette il punto esclamativo sulla sua prestazione con il gol del 5-1 e la tripletta personale.", "I RED DEVILS sorprendono tutti, alzano al cielo il primo titolo della loro storia e si laureano campioni della WEB CUP 2025 Over 50, premiando compattezza, spirito di squadra e determinazione.", "Onore a CAROLI ELETTRONICA, che nonostante una finale segnata da infortuni e assenze pesanti, porta a casa il secondo argento consecutivo: un cammino comunque da applausi."]}, {"id": 54, "t": "🥉Il Bronzo è di SS ANNUNZIATA! Ziwoondello KO", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(24)(0).jpg", "meta": "🥉FINALE 3/4° Posto Over5024/05/2025 ore 18:30SS ANNUNZIATA vs ZIWOONDELLO", "data": "24/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Match spettacolare e ricco di emozioni quello valido per il terzo posto della WEB CUP 2025. Le due squadre si affrontano a viso aperto, dando vita a una sfida combattutissima.", "È la SS Annunziata a sbloccare l’incontro: ci pensa D’Onghia, con una percussione centrale su perfetto lancio di Montanaro, a firmare l’1-0. La reazione di Ziwoondello è immediata e porta la firma di Serra, che su calcio di punizione trova il pari ristabilendo l’equilibrio.", "Ma D’Onghia è in giornata di grazia e riporta avanti i suoi con una prodezza da vero bomber: colpo di tacco su azione da calcio d’angolo per il 2-1. Il tris arriva con una splendida combinazione tutta in velocità tra D’Onghia e Carrieri, quest’ultimo autore di una prestazione da incorniciare e nominato MVP del match.", "Ziwoondello, però, non alza bandiera bianca: Caroli impegna il portiere con un gran tiro, sulla ribattuta si avventa Cervellera, che insacca il 3-2 e riapre i giochi.", "Nel finale, è Colucci a mettere il sigillo sul match: perfetto l’assist ancora di Carrieri e zampata vincente del numero 10 per il 4-2 che vale la medaglia di bronzo alla SS Annunziata.", "Onore a Ziwoondello, squadra che si conferma combattiva e mai doma, sempre in grado di offrire prestazioni di alto livello."]}, {"id": 55, "t": "🥉Il Bronzo è Ancora Tecsam: Palmento Ko 6-3", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME(1).jpg", "meta": "🥉FINALE 3/4° Posto Over5024/05/2025 ore 17:30 TECSAM - IL PALMENTO6-3", "data": "24/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Tecsam è ancora bronzo!", "La Tecsam si aggiudica il gradino più basso del podio nella WEB CUP 2025 superando con un netto 6-3 il Palmento, e conquista così per il secondo anno consecutivo la medaglia di bronzo. Un traguardo importante che conferma la solidità del gruppo: 3 partecipazioni, 3 podi (1 oro e 2 bronzi).", "Match sin da subito molto delineato, complice le numerose defezioni in casa Palmento, che ha comunque scelto di onorare l’impegno con rispetto e orgoglio, da veri campioni uscenti.", "A sbloccare il match è Chiarelli, che sfrutta un’indecisione di Michelangelo.", "L’1-1 di Conte sembra poter riaprire la gara, ma è solo un’illusione: Basile, tra i migliori in campo insieme al portiere MVP Baratta, sigla il 2-1 che indirizza definitivamente il match.", "Nella ripresa vanno a segno Cabrotti e due volte Carovigno, prima del sigillo finale del capitano Pasculli, che mette il risultato in ghiaccio con una grande giocata.", "Nel finale arriva l’orgoglio del Palmento con i gol di Colucci e Capitanèo, ma non bastano per imbastire una rimonta.", "Tecsam ancora sul podio, mentre il Palmento chiude quarto e a secco di medaglie."]}, {"id": 56, "t": "\"Caroli-Tecsam 7-6, spettacolo e colpi di scena: una sfida da cardiopalma!\"", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME(1).jpg", "meta": "🏆SEMIFINALE Over50 - 19/05/2025 ore 20:00CAROLI ELETTRONICA - TECSAM7-6", "data": "19/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Match da cardiopalma tra emozioni, rimonte e colpi di scena continui!", "Una sfida vibrante, maschia e combattuta fino all’ultimo secondo, quella andata in scena tra Caroli Elettronica e Tecsam, con i primi che la spuntano per 7-6 al termine di un incontro spettacolare.", "Parte fortissimo Caroli che nei primi dieci minuti mette subito in chiaro le cose: Palese apre le marcature, seguito dal raddoppio di Ottaviano e poi dal tris firmato da un gran gol di Albanese. La gara sembra chiusa, ma Tecsam reagisce con carattere: entra Semeraro Fabrizio e accorcia subito le distanze (3-1), poi Ezio Conte e Fragnelli Cesare completano una rimonta clamorosa fino al 3-3.", "Il sorpasso è servito ancora da Conte, che firma il 4-3 Tecsam. Il match si incattivisce: espulsi Ottaviano e Fragnelli dopo un acceso diverbio, si gioca 4 contro 4. Ma dura poco, perché Palese, su punizione, riporta il punteggio in parità.", "Nonostante l’inferiorità numerica, Caroli si riporta avanti con un contropiede fulmineo: Buonfrate serve Palese che insacca il 5-4. È assedio Tecsam, ma un super Vinci tra i pali (eletto MVP dell’incontro) mantiene in piedi i suoi con parate miracolose.", "Conte non molla, sigla il 5-5, ma Simone riporta subito avanti Caroli (6-5). Ancora Conte, imprendibile, trova il 6-6 con una percussione degna di nota. Ma a un minuto dal termine è ancora Palese, autore di un poker, a firmare il definitivo 7-6.", "Applausi per entrambe le squadre, autrici di un match emozionante e combattuto. Ora Caroli Elettronica ha nel mirino la finalissima di domenica, per provare a riprendersi quel titolo sfumato l'anno scorso ai rigori."]}, {"id": 57, "t": "Impresa RED DEVILS: eliminato IL PALMENTO, è finale storica!", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(22).jpg", "meta": "🏆SEMIFINALE Over50 - 18/05/2025 ore 19:00RED DEVILS - IL PALMENTO3-1", "data": "18/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Clamorosa sorpresa nella semifinale Over50 della WEB CUP 2025: i RED DEVILS battono 3-1 i campioni in carica de IL PALMENTO e conquistano la loro prima, storica finale del torneo!", "Il match si preannunciava teso ed equilibrato, e così è stato. A sbloccare la partita ci pensa il solito SERIO, che approfitta di un’incertezza del capitano DEVITO e porta avanti IL PALMENTO. Il primo tempo si gioca soprattutto a centrocampo, con poche vere occasioni da rete, ben neutralizzate da due portieri in stato di grazia: CARRIERI e MONTINARO.", "Nella ripresa, con il punteggio sull’1-0, i RED DEVILS non si arrendono e iniziano a spingere con un ispiratissimo CHIEPPA. Ma CARRIERI è un muro e tiene a galla i suoi. Dall’altra parte, anche IL PALMENTO prova a colpire con le incursioni di COLUCCI e MARANGI, ma si scontra con una difesa solida guidata magistralmente da SCIALPI, protagonista anche in fase di impostazione.", "A 12 minuti dal termine arriva l’episodio che cambia la partita: punizione dal limite guadagnata da Chieppa, si presenta alla battuta Capitan DEVITO che, desideroso di riscattarsi, trova il gol dell’1-1 con la complicità di una deviazione di Serio.", "IL PALMENTO reagisce con veemenza, ma trova sulla propria strada un super MONTINARO, decisivo con due interventi miracolosi. E proprio nel momento migliore dei campioni in carica, arriva il gol-beffa: corner guadagnato in contropiede dai REDS, SCIALPI calcia forte e centrale, trovando la deviazione di MARANGI che manda la palla in rete per il 2-1.", "Negli ultimi minuti IL PALMENTO tenta il tutto per tutto, ma in pieno recupero, su un’ennesima ripartenza, è ancora CHIEPPA a chiudere i conti siglando il 3-1 finale.", "I RED DEVILS volano così in finale, mentre IL PALMENTO dovrà accontentarsi della finalina 3°/4° posto, in programma sabato.", "Una serata da incorniciare per i REDS, autori di una vera e propria impresa contro i detentori del titolo."]}, {"id": 58, "t": "Sette magie per la finale: Il Piccolo Principe non sbaglia", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(20).jpg", "meta": "🏆SEMIFINALE Under - 17/05/2025 ore 18:30SS ANNUNZIATA - IL PICCOLO PRINCIPE4-7", "data": "17/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Sfida vibrante e ricca di emozioni tra la seconda e la terza forza del torneo: Il Piccolo Principe e SS Annunziata non tradiscono le attese.", "Partono forte i padroni di casa con il solito Salamina Donatello, che sblocca subito il match. Il Piccolo Principe sembra avere il controllo del gioco e raddoppia con un gol di rapina del capitano Marangi Paolo, subito protagonista.", "SS Annunziata, però, non ci sta e dopo un paio di tentativi dalla distanza di Semeraro, accorcia con Blasi, per poi trovare anche il pareggio con Montanaro Paolo, riportando il match sul 2-2.", "La risposta dei \"Principi\" è rabbiosa: ancora Salamina Donatello e poi Salamina Francesco, capocannoniere del torneo, riportano i loro sul +2 prima dell’intervallo.", "Nella ripresa SS Annunziata ci riprova con D’Onghia, ma su un assist perfetto del fratello, Francesco Salamina firma la doppietta e ristabilisce le distanze.", "Il match resta aperto grazie al gran gol di Cristofaro, tra i migliori dei suoi, ma ci pensa Marangi Domenico a ricacciare indietro gli avversari.", "Nel finale, Marangi Paolo si prende la scena con altri due gol, completando una prestazione da vero capitano e regalando ai suoi il pass per la finalissima di domenica contro l’HG FIVE.", "Ora Il Piccolo Principe ha fame di rivincita contro l'HG Five dopo lo 0-8 subito in campionato.", "Appuntamento da non perdere, Domenica ore 19:45 Sporting Club!"]}, {"id": 59, "t": "LA CORSA CONTINUA: HG FIVE è FINALE!!", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(21).jpg", "meta": "🏆SEMIFINALE Under - 17/05/2025 ore 17:30HG FIVE - ZIWOONDELLO5-1", "data": "17/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Sembrava una semifinale a senso unico sulla carta, ma il campo ha raccontato ben altro – almeno nella prima frazione.", "ZIWOONDELLO parte fortissimo e sorprende HG FIVE con un pressing alto e due occasioni clamorose capitate sui piedi di Caroli Piero e Bello, fermati solo da uno strepitoso Gianfrate, sempre più protagonista del torneo tra i pali.", "HG FIVE, imbattuta e favorita, fatica a entrare in partita: poco ritmo, tanti duelli persi a centrocampo e poche soluzioni offensive.", "Nonostante diversi errori sotto porta degli avversari, a sbloccarla ci pensa Cervellera Michele, il più costante e concreto dei suoi, che firma l’1-0.Si va al riposo con il minimo vantaggio, ma con la gara ancora apertissima.", "Nel secondo tempo l’inerzia cambia. Il gol dà fiducia all’HG FIVE che ritrova gioco e sicurezza: Martucci con un gran gol sigla il 2-0, seguito dalla rete di D’Onghia che chiude virtualmente il discorso sul 3-0.", "ZIWOONDELLO accusa il colpo, e l’assedio finale porta alla doppietta personale di Martucci, seguita dal gol della bandiera di Serra, prima dell'autogol sfortunato di Melambo che fissa il punteggio sul 5-1.", "HG FIVE vola meritatamente in finale a punteggio pieno (6 vittorie su 6) e conferma il suo status di squadra da battere.", "📅 Appuntamento con la storia: Domenica ore 19:45, la grande finale!", "Un solo tassello mancante per completare l’opera, riusciranno ad alzare al cielo il trofeo?"]}, {"id": 60, "t": "IL PICCOLO PRINCIPE CHIUDE IN BELLEZZA, GIALLOBLU KO!", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(19).jpg", "meta": "🏆5^GIORNATA - 10/05/2025 ore 17:00IL PICCOLO PRINCIPE - TEAM GIALLOBLU10-4", "data": "10/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Ultima partita del GIRONE con scenari già delineati: IL PICCOLO PRINCIPE certo del SECONDO POSTO matematico, mentre TEAM GIALLOBLU si gioca le ultime speranze di FINAL 4. Ma la squadra gialloblù si presenta in EMERGENZA: solo 5 uomini a referto, complice una rosa forse selezionata con leggerezza e ulteriormente colpita da INFORTUNI e INDISPONIBILITÀ.", "Il match si sblocca subito con un errore di AQUARO, portiere gialloblù, che regala a GIORANNA l’1-0.", "Reazione d’ORGOGLIO però dei GIALLOBLU, trascinati da un ispiratissimo COLUCCI – MVP della partita – che pareggia i conti e tiene a lungo la squadra in PARTITA.", "Ma sul finire del primo tempo, salgono in cattedra i FRATELLI SALAMINA: prima ALESSANDRO, poi FRANCESCO – quest’ultimo autore di una prestazione SONTUOSA – firmano l’allungo fino al 4-1.", "Nella ripresa COLUCCI prova a tenere vive le speranze con un'altra rete, ma è MARANGI, capitano de IL PICCOLO PRINCIPE, a ristabilire subito le distanze. COLUCCI non molla e sigla anche il 5-3, ma l'INFORTUNIO di SEMERARO spegne definitivamente le ambizioni dei GIALLOBLU, che finiscono per cedere di SCHIANTO.", "Nel finale c’è gloria anche per CAROVIGNO e ancora SALAMINA F., che sigilla la sua prestazione con un GOL a referto.", "FINISCE 10-4: IL PICCOLO PRINCIPE chiude il girone in serenità, TEAM GIALLOBLU saluta invece la competizione da FANALINO DI CODA."]}, {"id": 61, "t": "HG FIVE travolgente! 9-2 e record di 5 su 5!", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(18).jpg", "meta": "🏆5^GIORNATA - 08/05/2025 ore 21:00HG FIVE - SS ANNUNZIATA9-2", "data": "08/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Match d’alta quota tra due squadre già qualificate alle Final 4, ma con l’HG FIVE determinata a chiudere il girone a punteggio pieno. Missione compiuta: 5 su 5 e netta vittoria per 9-2 contro una SS ANNUNZIATA partita bene ma crollata alla distanza.", "Il match si apre con un sussulto dei gialloblù: D’ONGHIA A., protagonista del “derby familiare” con il fratello Orazio dall’altra parte, sblocca il punteggio con un bel destro a incrociare. Ma è un’illusione. L’HG FIVE si compatta e risponde immediatamente con una perla da fuori di MARTUCCI, che ristabilisce la parità.", "Da lì in poi è dominio HG: PALMISANO, autentico MVP e trascinatore del match, firma il sorpasso e apre la strada a una goleada senza repliche. GIANFRATE blinda la porta con interventi decisivi, mentre la SS ANNUNZIATA fatica a reggere l’urto e si affida a sporadiche ripartenze.", "CASTELLANA chiude il primo tempo con una bella conclusione da schema su calcio piazzato, poi ancora PALMISANO – autore di una tripletta – MARTUCCI (doppietta) e CERVELLERA MICHELE (due gol anche per lui) ampliano il divario nella ripresa. Inutile il timbro di CRISTOFARO nel finale, buono solo per le statistiche.", "A chiudere i giochi, il gol del 9-2 firmato da D’ONGHIA ORAZIO, che si prende anche la soddisfazione personale di vincere il duello in famiglia con il fratello Antonio.", "L’HG FIVE chiude il girone con un percorso netto e parte da strafavorita per le Final 4. Più opaca invece la fase conclusiva della SS ANNUNZIATA, rallentata da un calendario complicato.", "Appuntamento a sabato prossimo per le fasi decisive: lo spettacolo è appena iniziato."]}, {"id": 62, "t": "4-2: impresa Ziwoondello e sogno Final 4 ancora vivo!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(17).jpg", "meta": "🏆5^GIORNATA - 08/05/2025 ore 20:00ZIWOONDELLO - CIBANDOREVENTI 4-2", "data": "08/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Partita da dentro o fuori quella tra ZIWOONDELLO e CIBANDOREVENTI, con questi ultimi forti di due risultati su tre per volare alle Final 4, mentre i granata erano chiamati all’unico risultato possibile: la vittoria.", "L’approccio alla gara dei ragazzi in maglia granata è semplicemente perfetto: prima CAROLI PIERO sblocca il match con un gol di pregevole fattura, poi SERIO raddoppia con un destro a incrociare che gela i CIBANDOREVENTI, apparsi confusi e poco compatti nei primi minuti.", "Nonostante qualche buona iniziativa firmata SANTORO e MONTUORI, la squadra in maglia nera non riesce a trovare precisione sottoporta. ZIWOONDELLO ne approfitta e, prima del duplice fischio, ancora CAROLI PIERO – autore di una prestazione maiuscola – firma il 3-0 che sembra già una sentenza.", "Nella ripresa, però, cambia tutto. Trascinati dall’energia di un instancabile CARRIERI a bordo campo, i CIBANDOREVENTI si gettano all’attacco: il capitano LOMBARDO accorcia con un colpo di testa da manuale, poi MONTUORI riaccende le speranze con un delizioso scavetto.", "È assedio totale su MELAMBO, che si supera in più occasioni meritando il titolo di MVP del match. Traversa, palo e almeno tre parate decisive tengono a galla ZIWOONDELLO.", "E proprio nel momento migliore dei CIBANDOREVENTI arriva la zampata finale: CERVELLERA in contropiede chiude i giochi con un gol di tacco che manda in estasi i granata e condanna gli avversari all’eliminazione.", "ZIWOONDELLO vince 4-2 e ora vede le Final 4 più vicine che mai. Per la matematica, servirà ancora attendere il verdetto del match di sabato."]}, {"id": 63, "t": "Gol e spettacolo: IL PALMENTO chiude al comando!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/33333.jpg", "meta": "🏆5^GIORNATA - 04/05/2025 ore 09:30IL PALEMENTO - CAROLI ELETTRONICA6-6", "data": "04/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Spareggio d’alta quota che non tradisce le attese quello tra IL PALMENTO e CAROLI ELETTRONICA, protagoniste di un pirotecnico 6-6 che chiude il girone con un verdetto chiaro: in testa ci va IL PALMENTO, grazie alla miglior differenza reti.", "Entrambe restano imbattute, replicando il cammino parallelo dello scorso anno, ma il primato va ai campioni in carica.", "La sfida si accende subito con il vantaggio di CAROLI, firmato da SIMONE. Ma IL PALMENTO reagisce con il solito SERIO, che avvia una sfida personale con LACATENA: quest’ultimo mette a segno un poker da urlo, mentre SERIO risponde con una tripletta che li piazza appaiati al secondo posto tra i bomber del torneo.", "Nel mezzo, c’è gloria anche per MARANGI, punto di riferimento e metronomo per CAROLI, tornato al meglio dopo l’infortunio. Brilla anche CHIARELLI per IL PALMENTO, decisivo con una doppietta che tiene a galla i suoi nei momenti più complicati. A segno anche COLUCCI, in una gara combattutissima, dove agonismo e voglia di vincere non sono mai mancati.", "Alla fine, è 6-6. Pareggio spettacolare che premia IL PALMENTO con la vetta del girone e la sfida in semifinale contro i RED DEVILS. Per CAROLI ELETTRONICA c’è la TECSAM. Ma una cosa è certa: il cammino verso la finale è ancora tutto da scrivere."]}, {"id": 64, "t": "Zebras travolgenti: Caramia show e Levaphone ko 12-1", "img": "https://f2x9b.emailsp.com/documenti/1/222.jpg", "meta": "🏆5^GIORNATA - 04/05/2025 ore 08:30ZEBRAS - LEVAPHONE 12-1", "data": "04/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Sfida che vale per evitare l’ultima posizione, con entrambe le squadre ancora a secco di punti ma con cammini molto diversi. Il match, però, ha ben poca storia: gli ZEBRAS entrano in campo con un atteggiamento feroce e chiudono i conti sin dai primi minuti.", "A guidare il trionfo c’è uno straripante CARAMIA, autentico trascinatore e autore di ben 7 gol, che domina in ogni zona del campo. Al suo fianco un Bello ispiratissimo, che mette a segno un elegante poker personale. A chiudere la festa ci pensa Carrieri, che nel finale firma la dodicesima rete.", "Per i LEVAPHONE, unica nota lieta il solito Tagliente, che trova ancora una volta la via del gol, ma non può nulla davanti al crollo generale della sua squadra. Nonostante il pesante passivo, da sottolineare lo spirito del gruppo guidato da capitan Ruggieri, sempre presente e rispettoso degli impegni, simbolo di un calcio che sa unire e far divertire a ogni età.", "Con questa prestazione, Caramia vola in testa alla classifica marcatori in solitaria. Chissà se questi sette gol faranno drizzare le antenne a qualche team in ottica Final.", "Tanti rimpianti per gli Zebras, che forse con un Caramia in questa forma avrebbero potuto ambire a qualcosa in più. Ma resta la soddisfazione di una prima partecipazione alla WEB CUP vissuta intensamente e con lo sguardo già rivolto al futuro.", "Un match a senso unico, ma che ha comunque regalato emozioni, sportività e voglia di stare insieme."]}, {"id": 65, "t": "Battaglia da Final Four: la spunta la TECSAM in un match da applausi!", "img": "https://f2x9b.emailsp.com/documenti/1/11111.jpg", "meta": "🏆5^GIORNATA - 03/05/2025 ore 16:00TECSAM - RED DEVILS4-3", "data": "03/05/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Match dal sapore di semifinale quello tra TECSAM e RED DEVILS, con entrambe già qualificate alle Final Four, ma in palio un turno sulla carta più favorevole. Partenza sprint per la TECSAM, trascinata da un ispiratissimo CONTE che apre le marcature, ma è costretto poco dopo a lasciare il campo per infortunio che tiene in ansia il gruppo in vista del gran finale.", "I RED DEVILS reagiscono subito con il solito CHIEPPA, implacabile sotto porta e al 14º centro stagionale, ma è la TECSAM a far la voce grossa: FRAGNELLI, autore di una prova superlativa da MVP, segna il nuovo vantaggio e BASILE poco dopo firma il 3-1 che sembra chiudere i giochi.", "Ma i REDS non mollano mai, e ancora CHIEPPA suona la carica con la rete del 3-2.", "La partita resta apertissima, intensa e spettacolare. Il neoacquisto SEMERARO ristabilisce le distanze (4-2), ma il capitano DEVITO tiene vivi i suoi con il gol del 4-3, in un finale al cardiopalma.", "Vittoria che  consente alla TECSAM di portare a casa tre punti preziosi per il miglior piazzamento. Onore ai RED DEVILS, mai domi e pronti a dare battaglia nelle finali.", "Partita vera, vibrante, giocata con intensità e qualità da entrambe: le Final Four promettono spettacolo!"]}, {"id": 66, "t": "NERVI TESI E MATCH CALDO, LA SPUNTA CAROLI 6-4 ALLA TECSAM!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(16).jpg", "meta": "🏆4^GIORNATA - 26/04/2025 ore 08:30CAROLI ELETTRONICA - TECSAM6-4", "data": "26/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Match acceso e combattuto come da pronostico, con entrambe le squadre determinate a vendere cara la pelle.", "Parte forte la Tecsam con il solito Conte che sblocca il risultato, ma arriva subito la risposta di Lacatena per Caroli, che ristabilisce la parità.Tensione alta in campo con polemiche, urla e ammonizioni, in un match dove proprio Conte si distingue per il suo fair play.", "Caroli passa avanti con Buonfrate, ma la Tecsam risponde con Carivigno. Ancora Conte regala il vantaggio ai suoi, ma Albanese ristabilisce il 3-3.Nel finale si scatena Lacatena, MVP e autore di un poker personale, chiudendo di fatto il match.", "Nel mezzo arriva anche il gol di Fragnelli per Tecsam, che però non basta a evitare la seconda sconfitta consecutiva.", "Ora Tecsam attesa dalla sfida contro i Reds in grande forma, mentre Caroli si giocherà il primato contro Il Palmento, in un remake della finale dello scorso anno."]}, {"id": 67, "t": "RED DEVILS SHOW: 10-1 AL LEVAPHONE E FINAL 4 CONQUISTATE", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(15).jpg", "meta": "🏆4^GIORNATA - 26/04/2025 ore 08:30RED DEVILS - LEVAPHONE", "data": "26/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["10-1I Red Devils non falliscono l'appuntamento con la storia e asfaltano il Levaphone con un netto 10-1, conquistando con una giornata d’anticipo il pass per le Final 4.", "Protagonista assoluto Chieppa, incontenibile sotto porta con sei reti. Splendida anche la prova di Santoro, che dopo una serie di occasioni sprecate si sblocca su rigore e firma una preziosa tripletta. Nel finale, la firma di capitan Devito corona la giornata, con il decimo gol che regala ai Reds la prima \"doppia cifra\" in tre edizioni.", "Tra i migliori in campo anche Montinaro: il portiere, premiato MVP del match, è stato sempre impeccabile nelle chiusure difensive e fondamentale in fase di impostazione, vero uomo in più per i suoi.", "Unico sussulto del Levaphone arriva dal solito Tagliente, a segno anche oggi ma troppo isolato per evitare il tracollo. Ora per il Levaphone resta in palio il 5° posto, da contendersi nell’ultima giornata contro gli Zebras."]}, {"id": 68, "t": "Il Piccolo Principe stoppa la corsa di SS Annunziata", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(14).jpg", "meta": "🏆4^GIORNATA - 26/04/2025 ore 17:00IL PICCOLO PRINCIPE - SS ANNUNZIATA5-2", "data": "26/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Vittoria pesante per Il Piccolo Principe nello scontro diretto contro SS Annunziata. La squadra in maglia gialla parte fortissimo e indirizza subito il match: è l'esordiente Diwouta a sbloccare il risultato con un tap-in da rapace d'area.", "Il raddoppio arriva poco dopo con una splendida conclusione mancina di Marangi D., che sale in cattedra orchestrando tutte le azioni offensive. Sul finire del primo tempo, è Salamina D. a firmare il tris, mandando le squadre negli spogliatoi sul 3-0.", "Nella ripresa, nonostante il tentativo di reazione di SS Annunziata, Il Piccolo Principe allunga ancora con Salamina F. in contropiede.", "Con orgoglio, SS Annunziata trova due reti in rapida successione con Marangi e Blasi, provando a riaprire la gara. Ma a spegnere ogni speranza ci pensa ancora Marangi D., autentico protagonista della sfida, che firma la doppiettapersonale e chiude il match sul definitivo 5-2.", "Entrambe le formazioni sono già qualificate per le Final Four, ma in queste ultime giornate si giocheranno punti preziosi per definire il posizionamento finale.", "Una sfida che potrebbe non essere l'ultima tra queste due squadre, con un possibile nuovo incrocio in semifinale."]}, {"id": 69, "t": "IL PALMENTO travolge gli ZEBRAS 10-4 e vola in vetta!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(13).jpg", "meta": "🏆4^GIORNATA - 26/04/2025 ore 16:00IL PALMENTO - ZEBRAS10-4", "data": "26/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Pronti via, gli ZEBRAS sbloccano subito il match con Rocchetti, tra le proteste del Palmento per un presunto tocco di mano non visto dal direttore di gara Sergio. Con grande gesto di fair play, però, gli ZEBRAS si auto-infliggono un'autorete, riportando il risultato in parità e spegnendo subito le polemiche.", "La partita si accende: ritmo alto, duelli intensi e occasioni da entrambe le parti. A spezzare l'equilibrio ci pensa Serio, autentico trascinatore del Palmento, che firma una doppietta e prova a lanciare la fuga. Gli ZEBRAS però non mollano: Caramia accorcia le distanze e Rocchetti, all'esordio da MVP, sigla la sua doppietta personale rimettendo il match in bilico.", "Ma è ancora Serio a salire in cattedra: il leader del Palmento prende per mano la squadra e spacca la partita. Nella ripresa è un vero e proprio monologo dei campioni in carica, con trame spettacolari e gol a raffica. Serio chiude con ben 7 reti personali, mentre alla festa si aggiungono anche Braccioforte e Minardi.", "Gli ZEBRAS alzano bandiera bianca e vedono svanire il sogno Final 4, mentre il Palmento conquista il primo posto in classifica, confermandosi ancora una volta la squadra da battere."]}, {"id": 70, "t": "HG Five fa 4/4, Ziwondello abbattuto!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(12).jpg", "meta": "🏆4^GIORNATA - 24/04/2025 ore 21:00HG FIVE- ZIWOONDELLO3-0", "data": "24/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Sulla carta sembrava un match a senso unico, ma in campo le cose sono state tutt’altro che semplici per i primi della classe.", "HG FIVE fatica a trovare spazi contro un organizzato Ziwoondello, bravo soprattutto in fase difensiva grazie alle ottime prestazioni di SERIO e CAROLI R., veri baluardi granata.", "Nonostante la pressione, è Ziwoondello a rendersi pericoloso in diverse occasioni, costringendo il super GIANFRATE a una nuova prestazione da incorniciare, impreziosita dall’ennesimo clean sheet.", "Il match resta in equilibrio fino al quarto d'ora, quando PALMISANO riesce finalmente a sbloccarlo, finalizzando una bella combinazione su assist di CASTELLANA.", "Ziwoondello non si arrende e continua a provarci, ma trova ancora una volta un insuperabile Gianfrate a dire di no.", "Nella ripresa, HG FIVE riesce a trovare il raddoppio ancora con PALMISANO, protagonista di una splendida rete di tacco che indirizza definitivamente la partita.", "Con il doppio vantaggio, i primi della classe giocano con maggiore serenità e chiudono i conti con la rete di CERVELLERA MARCO, bravo a insaccare su schema da calcio da fermo, dopo una bella combinazione con MICOLI e CERVELLERA MICHELE.", "HG FIVE prosegue così il suo percorso perfetto con 4 vittorie su 4 e guarda ora con fiducia all'ultimo impegno della fase a gironi, prima delle ambite Final 4.", "Per Ziwoondello invece, arriva un’altra sconfitta, ma il destino potrebbe essere ancora nelle loro mani: nell’ultima sfida contro CIBANDOREVENTI sarà un vero e proprio spareggio per l’accesso alle Final 4."]}, {"id": 71, "t": "CIBANDOREVENTI travolge i GIALLOBLU e sogna le Final 4!", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(11).jpg", "meta": "🏆4^GIORNATA - 24/04/2025 ore 20:00CIBANDOREVENTI - TEAMGIALLOBLU 7-2", "data": "24/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Match fondamentale in ottica qualificazione alle Final 4, con entrambe le squadre alla ricerca di punti pesanti. Parte forte Cibandoreventi, trascinata da un ispiratissimo Basile, che apre le danze con un gran destro da fuori area. Poco dopo è Santoro a raddoppiare, premiando un inizio di gara dominato in lungo e in largo dai suoi.", "Nel momento migliore per Cibando, è Conte a riaprire i giochi: l’ultimo a mollare tra le fila di un Team GialloBlu rimaneggiati e privi di sostituzioni.", "Il suo gol prova a dare una scossa, ma Basile è in giornata di grazia e con altre due reti personali firma la tripletta che indirizza pesantemente il match.", "Nella ripresa sale in cattedra anche il sempre ordinato e preciso Grottini, che mette il risultato in cassaforte con una doppietta magistrale.", "Nel finale c’è spazio per un’altra gioia anche per Santoro, che sigla la sua doppietta personale, sfiorando addirittura la tripletta con due pali che gli negano ulteriori soddisfazioni.", "Conte nel finale trova ancora la via del gol, rendendo il passivo meno pesante. Un gol che, potrebbe risultare decisivo per la differenza reti in caso di arrivo a pari punti.", "Nota di merito per Carriero, nominato MVP dal direttore di gara: sempre presente, ha lottato con grinta e dedizione, incitando i compagni anche dalla panchina. Uomo squadra per eccellenza: da lui adesso manca solo il gol.", "Cibandoreventi si rilancia con forza nella corsa alle Final 4: il destino è nelle loro mani.", "Team GialloBlu resta fermo a un punto in classifica a una giornata dal termine: la qualificazione non è più solo nelle loro mani, ma la speranza è ancora viva."]}, {"id": 72, "t": "SS ANNUNZIATA da Final 4: CIBANDOREVENTI si arrende!", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME.jpg", "meta": "🏆3^GIORNATA - 17/04/2025 ore 20:00SS ANNUNZIATA - CIBANDOREVENTI 5-2", "data": "17/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Partita intensa quella tra SS ANNUNZIATA e CIBANDOREVENTI, recupero della terza giornata della Web Cup Under. L’avvio è equilibrato e rispettoso, ma a rompere l’inerzia è un pasticcio difensivo: un retropassaggio errato di Carriero e la mancata reazione di Campanella – oggi schierato tra i pali – regalano un goffissimo 1-0 ai padroni di casa.", "La SS ANNUNZIATA prende fiducia e trova il raddoppio con Cristofaro, abile a ribadire in rete una corta respinta del portiere. Sul finire della prima frazione è Messia a prendersi la scena con un paio di interventi super, che mantengono il doppio vantaggio all’intervallo.", "Nella ripresa CIBANDOREVENTI alza il ritmo e accorcia le distanze con il proprio capitano Lombardo, riaccendendo le speranze. Ma nel momento migliore degli All Black, ci pensa Semeraro con un eurogol da fuori area: tiro all’incrocio e 3-1. Un colpo durissimo per gli ospiti, che però non mollano e si rendono pericolosi con Basile, Grottini e compagni, trovando però un Messia in giornata di grazia.", "Ancora Semeraro chiude virtualmente la gara con la doppietta personale, poi Montanaro mette il sigillo sul 5-1. In chiusura c’è spazio per la rete della bandiera di Grottini, autore di un gran gol per il 5-2 finale.", "Con questa vittoria, SS ANNUNZIATA si prende la vetta del girone e conquista l’accesso alle Final 4. Per CIBANDOREVENTI la corsa non è ancora finita: le ultime due giornate saranno decisive per strappare il pass."]}, {"id": 73, "t": "HG FIVE SHOW: 8-0 SONORO E PRIMI SOGNI DI GLORIA!", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(9).jpg", "meta": "🏆3^GIORNATA - 10/04/2025 ore 21:00HG FIVE - IL PICCOLO PRINCIPE8-0", "data": "10/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Un risultato che parla da sé: HG FIVE domina e annienta Il Piccolo Principe con una prestazione sontuosa in ogni zona del campo. Le aspettative per questo primo big match stagionale erano alte, ma HG FIVE si è presentata più che pronta, imponendo ritmo, qualità e gol sin dai primi minuti.", "A sbloccarla è Palmisano, all’esordio assoluto alla WEB CUP 2025, autore di una gara da 9 pieno per personalità, corsa e freddezza. Il raddoppio lo firma D’Onghia Orazio, con un capolavoro al volo di destro che si insacca sotto l’incrocio: applausi a scena aperta!", "D’Onghia si prende la scena diventando MVP del match grazie a una tripletta da sogno, confermandosi uomo chiave per questa HG FIVE che inizia a far paura. Alla festa del gol partecipano anche Cervellera Michele e Cervellera Marco, oltre al già citato Palmisano, rendendo il tabellino ancora più pesante.", "Dall’altra parte, Il Piccolo Principe appare spento, slegato, con poche idee e ancor meno gioco corale. Qualche timido tentativo da fuori di Salamina A. non impensierisce l’attento Gianfrate, sempre sicuro tra i pali.", "Lo stesso Salamina viene poi espulso nel finale per un fallo di reazione su Palmisano: rosso ineccepibile.", "Da segnalare in panchina Mister Micoli, anima tecnica di questa HG FIVE: la squadra lo segue, e lui sembra aver già trovato la sua dimensione da guida.", "Nota dolente di giornata, il brutto infortunio al ginocchio per Marangi Cesare, cuore e condottiero dell’HG FIVE. A lui va un grandissimo in bocca al lupo, con la speranza di rivederlo presto in campo!", "Giornata da dimenticare per Il Piccolo Principe, ma il cammino è ancora lungo. Per HG FIVE invece, i sogni iniziano a prendere forma."]}, {"id": 74, "t": "Battaglia senza vincitori: gol, emozioni e polemiche in Ziwoondello–GialloBlu", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(10).jpg", "meta": "🏆3^GIORNATA - 10/04/2025 ore 20:00TEAM GIALLOBLU - ZIWOONDELLO6-6", "data": "10/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Subito scintille nel primo match della terza giornata! Ziwoondello parte forte, prende campo e mette sotto pressione gli avversari, ma è il Team GialloBlu a colpire per primo: contropiede fulmineo e Palazzo firma l’1-0.", "La risposta granata è immediata e veemente: Piero Caroli, in giornata di grazia, ribalta il risultato con giocate da MVP. I GialloBlu faticano a reagire e subiscono l’allungo con i gol di Roberto Caroli e Serra, che sembrano chiudere i giochi. Prima dell’intervallo, però, Carovigno accorcia e si va al riposo sul 5-2 per Ziwoondello.", "Nella ripresa cambia tutto: il Team GialloBlu torna in campo con orgoglio e determinazione. Ancona riapre il match, Carovigno colpisce ancora, ma è il portiere Aquaro a diventare protagonista assoluto: prima segna il gol del pareggio con un bolide da fuori, poi, dopo il 6-5 firmato ancora da Caroli R. in contropiede, si ripete con un'altra rete che vale il 6-6.", "Nel finale incandescente, proprio Aquaro – autentico uomo copertina del match con due gol e una parata chiave – viene espulso per proteste al triplice fischio. Seconda espulsione in due gare per lui, ma anche secondo gol: statistica che fa riflettere.", "Un punto a testa per entrambe le squadre che smuovono finalmente la classifica.", "Tutto ancora in gioco per la corsa alle fasi finali.", "Finale rovente per il Team GialloBlu, tra polemiche e uno spettacolo che avremmo sinceramente preferito evitare, considerando lo spirito e gli obiettivi di questa manifestazione."]}, {"id": 75, "t": "Regna l'Equilibrio: CAROLI alle Final4 e REDS imbattuti!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(8).jpg", "meta": "", "data": "", "anno": "", "comp": "WEB CUP", "cat": "over50", "p": []}, {"id": 76, "t": "IL PALMENTO stacca il pass per le FINAL4, LEVAPHONE demolito!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(7).jpg", "meta": "🏆3^GIORNATA - 06/04/2025 ore 08:30IL PALEMNTO vs LEVAPHONE 12-1", "data": "06/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Domenica mattina di fuoco per la 3^ giornata della WEB CUP, che si apre con i campioni in carica de IL PALMENTO subito protagonisti. Dopo l’ottima vittoria nel turno precedente, i GIALLO/NERI affrontano un LEVAPHONE ancora a secco di punti ma desideroso di riscatto.", "La partenza è sprint: è SERIO a sbloccare il match con una grande giocata nei primi minuti. Ma la reazione dei BIANCHI è immediata: COLUCCI finalizza una ripartenza con un meraviglioso tiro al volo, ristabilendo subito l’equilibrio.", "Seguono 15 minuti di equilibrio puro, con occasioni da entrambe le parti e grande intensità. Ma è solo l’inizio della tempesta giallonera: SERIO, autentico trascinatore e MVP dell’incontro, sale in cattedra con ben 5 gol, supportato da uno scatenato BRACCIOFORTE, autore di una tripletta personale.", "Nella ripresa, IL PALMENTO dilaga senza pietà, approfittando del crollo fisico e mentale degli avversari, ormai sfiduciati e con la testa già alla prossima partita.", "Con questa vittoria schiacciante, IL PALMENTO vola a 7 punti, blindando con due giornate d’anticipo l’accesso alle Final 4. Resta ora da definire la posizione nel girone, decisiva per gli incroci in semifinale.", "Per LEVAPHONE, la speranza è appesa a un filo: servirà una vittoria obbligatoria nella prossima giornata per restare in corsa."]}, {"id": 77, "t": "Dominio Incontrastato: Il Piccolo Principe Schiaccia ZiWondello", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(6).jpg", "meta": "🏆2^GIORNATA - 05/04/2025 ore 17:00IL PICCOLO PRINCIPE vs ZIWOONDELLO6-1", "data": "05/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Ritmi subito altissimi nel posticipo della seconda giornata. I Gialli del Piccolo Principe partono a razzo, dominando in palleggio e intensità e trovando subito un doppio vantaggio che indirizza il match.", "Salamina D. brilla tra le fila dei vincitori: doppietta e assist da applausi che mettono il sigillo su una prestazione da protagonista assoluto.ZiWondello prova a resistere con orgoglio, ma il divario tecnico e fisico è evidente. Nonostante il pesante passivo, spicca la prova del capitano Caroli, vero gladiatore, premiato come MVP di giornata.", "Il dominio del Piccolo Principe è totale: 6-0 fino ai secondi finali, quando Serra segna il gol della bandiera per ZiWondello, utile solo per le statistiche.", "Dopo sole due giornate, la classifica si spacca: la parte alta si fa sentire a pieno punteggio, mentre il fondo resta ancora a secco. La prossima settimana promette match ad alta tensione!"]}, {"id": 78, "t": "TECSAM, vittoria pesante: 6-4 alle Zebras e Final Four più vicine!", "img": "https://f2x9b.emailsp.com/documenti/1/TECZEB.jpg", "meta": "🏆3^GIORNATA - 05/04/2025 ore 16:00TECSAM vs ZEBRAS6-4", "data": "05/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Partita intensa e combattuta nella terza giornata del Campionato Over50 della WEB CUP 25, con in palio punti fondamentali in chiave qualificazione. TECSAM e ZEBRAS si affrontano a viso aperto, regalando al pubblico una gara maschia, equilibrata e ben giocata.", "La TECSAM parte forte e trova il vantaggio con CONTE, autentico trascinatore e terminale offensivo letale. L’intesa con PALAZZO è il valore aggiunto della squadra: i due confezionano giocate di qualità e mantengono alto il baricentro dei Tecsaniani.", "Gli ZEBRAS, oggi più ordinati, subiscono la beffa sul primo gol a causa di un’indecisione di CARRIERI. Ma il numero uno si riscatta con una prova superlativa: parate decisive e grinta da vendere, tanto da meritarsi il titolo di MVP assegnato dal direttore di gara.", "Sugli scudi ancora una volta CARAMIA, autore di una doppietta che lo conferma tra i protagonisti assoluti della competizione. Bene anche CARNEVALE e OLIVIERI, che danno equilibrio e dinamismo agli ZEBRASin netta crescita.", "Con questa vittoria, la TECSAM mette una seria ipoteca sulla qualificazione alle FINAL FOUR, mentre per gli ZEBRAS sarà decisiva la quarta giornata, dove ad attenderli ci saranno i campioni in carica.", "Ultima chiamata per restare agganciati al treno che porta alle final four di Maggio."]}, {"id": 79, "t": "HG FIVE spinge sull’acceleratore: 4-1 e ambizioni da titolo!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(5).jpg", "meta": "🏆2^GIORNATA - 03/04/2025 ore 21:00HG FIVE vs CIBANDOREVENTI4-1", "data": "03/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Sfida che parte con grande equilibrio nei primi minuti, ma basta una manovra corale d'alta scuola per rompere gli indugi: il tandem Castellana–Cervellera M. confeziona il gol del vantaggio, indirizzando subito la gara sui binari biancorossi.", "Una volta sbloccato il risultato, HG FIVE prende in mano il pallino del gioco, alzando i ritmi con fraseggi rapidi e improvvise accelerazioni che costringono CIBANDOREVENTI sulla difensiva. Sugli scudi il portiere Conserva, chiamato agli straordinari per evitare un passivo ancora più pesante.", "I ragazzi in maglia nera provano a reagire con Basile e Grottini, i più propositivi, ma la difesa di HG regge senza affanni. A chiudere virtualmente il match ci pensa Cervellera, assoluto protagonista, che firma una doppietta da incorniciare.", "CIBANDOREVENTI prova a riaprire il match con un gran destro incrociato di Basile che trova l’incrocio dei pali, accorciando le distanze a 10’ dal termine. Ma ogni speranza si spegne poco dopo con la goffa autorete di Conserva, che su corner di Micoli devia nella propria porta fissando il punteggio sul definitivo 4-1.", "Prestazione solida e brillante di HG FIVE, che continua a convincere e ora non può più nascondersi: è una delle candidate forti per il titolo.", "Per CIBANDOREVENTI tanta buona volontà ma poca lucidità sotto porta: serviranno più concretezza e freddezza per conquistare i primi punti.", "Siamo solo alla seconda giornata, e tutto è ancora in gioco."]}, {"id": 80, "t": "SS ANNUNZIATA A VALANGA: GIALLOBLU TRAVOLTI", "img": "https://f2x9b.emailsp.com/documenti/1/FULL%20TIME%20(3).jpg", "meta": "🏆2^GIORNATA - 03/04/2025 ore 20:00SS ANNUNZIATA vs TEAM GIALLOBLU4-0", "data": "03/04/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["SS Annunziata prosegue senza intoppi il proprio cammino, travolgendo con un perentorio 4-0 il Team GialloBlu in una gara a senso unico. Gli uomini in maglia grigia impongono da subito ritmo e qualità, approfittando anche dell’emergenza tra i pali degli avversari, costretti a schierare Ancona, fuori ruolo, in seguito alla squalifica di Aquaro rimediata alla 1^ giornata.", "Il Team GialloBlu non si arrende e lotta con orgoglio fino al triplice fischio, ma nulla può contro l’organizzazione e la brillantezza atletica degli avversari. Fondamentale la prova del portiere Maggi, sempre attento nelle uscite e sicuro tra i pali, e quella di Semeraro, dominatore in mezzo al campo e premiato dall’arbitro come MVP del match per la sua qualità nelle chiusure e nelle ripartenze.", "Carrieri apre le danze con una doppietta che indirizza subito la gara. D’Onghia A. sigla una rete da applausi, mentre Cristofaro chiude il conto blindando il risultato nel finale.", "Percorso fin qui impeccabile per la SS Annunziata: 14 gol fatti, solo 1 subito in due partite. La squadra si candida con forza come favorita alla vittoria finale.", "Ancora a quota zero invece il Team GialloBlu, frenato da assenze pesanti ma ancora in corsa per un posto alle Final Four. Con il rientro dei titolari, tutto è ancora possibile."]}, {"id": 81, "t": "CAROLI ELETTRONICA SCHIACCIASASSI, LEVAPHONE KO!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME%20(2).jpg", "meta": "🏆2^GIORNATA - 30/03/2025 ore 09:30CAROLI ELETTRONICA vs LEVAPHONE15-3", "data": "30/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Caroli Elettronica prosegue la sua marcia trionfale, confermandosi una delle squadre da battere .", "L’inizio del match lascia intravedere equilibrio, con i Blancos di capitan Scipione che, dopo aver subito il vantaggio avversario, rispondono con un micidiale uno-due che sembra poter cambiare l’inerzia della gara.", "Ma è solo un’illusione.", "A prendere il controllo del match sono Palese e Lacatena, il tandem offensivo più letale del torneo.", "Palese mette a segno quattro reti, issandosi in vetta alla classifica marcatori, mentre Lacatena abbina corsa e gol, risultando ancora una volta determinante.", "Alla festa partecipa anche Marangi A., rientrato dopo l’infortunio: prima difende tra i pali, poi si scatena con una doppietta di gran classe.", "Da segnalare anche i due gol di Buonfrate e l’ottima prova di Simone, al debutto stagionale.", "Per Levaphone, invece, un’altra serata da dimenticare. Le poche note liete arrivano da Tagliente, autore di una tripletta e sempre pronto a lottare per la squadra, e da Leone, in gol e prezioso nella gestione del possesso.", "Dalla prossima giornata, per Levaphone sarà vietato sbagliare: un altro passo falso potrebbe compromettere definitivamente le speranze di qualificazione.", "Caroli Elettronica, invece, punta a chiudere i conti già domenica mattina."]}, {"id": 82, "t": "IL PALMENTO SI PRENDE LA SCENA: TECSAM KO 8-4!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/h.jpg", "meta": "🏆2^GIORNATA - 30/03/2025 ore 08:30IL PALMENTO vs TECSAM8-4", "data": "30/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Il match ha rispettato pienamente le aspettative della vigilia, mettendo di fronte le due squadre vincitrici delle ultime edizioni! Una partita intensa, caratterizzata da un clima acceso e qualche scintilla in campo.", "La TECSAM parte forte e passa subito in vantaggio grazie a CONTE, ma la reazione dei campioni in carica non si fa attendere: un BRACCIOFORTE in versione top guida la rimonta, ribaltando il risultato. Il primo tempo si chiude sul 4-3 per IL PALMENTO, dopo una battaglia equilibrata.", "Nella ripresa, però, i campioni in carica prendono il controllo del match. Difendono con ordine e sfruttano le ripartenze, grazie anche a un’ottima prova di MARANGI P., che va ancora una volta a segno. Anche COLUCCI lascia il segno con una prestazione super, contribuendo alla conquista di tre punti pesantissimi.", "TECSAM, con poche rotazioni a disposizione, fatica a tenere il ritmo e, nonostante la doppietta firmata da CAROVIGNO-CONTE, incassa la prima sconfitta stagionale."]}, {"id": 83, "t": "HG FIVE - TEAM GIALLO BLU: CHE BATTAGLIA!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME(0).jpg", "meta": "🏆1^GIORNATA - 29/03/2025 ore 17:00HG FIVE  vs TEAM GIALLOBLU5-4", "data": "29/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["La prima giornata del torneo regala subito emozioni forti con un match al cardiopalma tra HG FIVE e TEAM GIALLO BLU, concluso con un combattutissimo 5-4. Intensità, voglia e carattere hanno caratterizzato una sfida che ha tenuto tutti con il fiato sospeso fino all’ultimo secondo.", "Il primo tempo è stato un monologo dei BLACK, che hanno imposto il loro gioco grazie a un possesso palla veloce e a una precisione letale sottoporta. A suonare la carica è stato capitan Marangi, autentico leader e mattatore del match, che con una doppietta ha subito indirizzato la sfida a favore della sua squadra.", "Nella ripresa, l’HG FIVE ha continuato a controllare il gioco con scambi rapidi tra Conte, Ancona, Semeraro e Carovigno, senza però impensierire più di tanto la retroguardia avversaria. Il TEAM GIALLO BLU ha sfruttato le ripartenze e la velocità di Martucci, che non solo ha trovato la rete, ma ha anche costretto il portiere avversario a un’ammonizione per fermarlo in extremis.", "Marangi si è confermato uomo del match con la rete del 4-0 e la sua personale tripletta, mettendo in cassaforte il titolo di MVP della partita. Tuttavia, il calo fisico dell’HG FIVE, privo di cambi, ha permesso ai GIALLOBLU di rialzare la testa. Un eurogol di Semeraro ha dato il via alla rimonta, seguito da un micidiale uno-due tra Carovigno e Ancona che ha riaperto i giochi sul 4-3 a sette minuti dal termine.", "A riportare ossigeno ai BLACK ci ha pensato D’Onghia con un potente tiro da fuori area, complice una clamorosa papera del portiere avversario, che ha allungato nuovamente il vantaggio sul 5-3. Il TEAM GIALLO BLU, però, non ha mai smesso di crederci e ha continuato il suo assedio con il portiere di movimento, ma l’azzardo è costato caro: doppia ammonizione e spogliatoi anticipati per l’estremo difensore. Nonostante ciò, Ancona è riuscito a trovare ancora la rete nel finale, lasciando tutto in bilico negli ultimi 90 secondi.", "Con grande determinazione, Marangi ha guidato i suoi fino al fischio finale, assicurandosi tre punti fondamentali per l’inizio del torneo. Un match spettacolare e giocato a ritmi altissimi, che ha dimostrato la qualità e la grinta di entrambe le squadre. Complimenti a tutti i protagonisti per lo show offerto in questa prima giornata!"]}, {"id": 84, "t": "RED DEVILS SCATENATI: VITTORIA E TRE PUNTI PESANTI", "img": "https://f2x9b.emailsp.com/documenti/1/red.jpg", "meta": "🏆2^GIORNATA - 29/03/2025 ore 16:00RED DEVILS vs ZEBRAS4-2", "data": "29/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Partita intensa e combattuta quella tra Red Devils e Zebras, terminata con una vittoria fondamentale per i Diavoli Rossi, che mettono in cassaforte tre punti d’oro per la qualificazione.", "L’inizio di gara è caratterizzato
