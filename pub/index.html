 da grande equilibrio, con le due squadre che si studiano e concedono poco. Il match si sblocca grazie a una prodezza di Caramia, che con un destro da fuori area sorprende tutti e porta in vantaggio i Reds. La risposta degli Zebras arriva proprio allo scadere del primo tempo con Chieppa, autore di un gol pesantissimo per il morale della sua squadra.", "Nella ripresa, i Red Devils alzano il ritmo e prendono il controllo del gioco. La difesa si registra con Occhinegro(MVP di giornata) Carbotti e Marinuzzi precisi e puntuali nelle chiusure, concedendo pochissime occasioni agli avversari.", "Il vantaggio arriva con Santoro dopo un’azione rocambolesca, seguito da un micidiale uno-due di Chieppa che spegne le speranze degli Zebras. Nel finale, c’è ancora spazio per la doppietta di Caramia, che consolida la sua leadership nella classifica marcatori. (almeno per una notte)", "Nonostante la sconfitta, tra le file degli Zebras spicca la prestazione di Olivieri, autore di una prova maiuscola che ha permesso alla sua squadra di restare in partita fino all’ultimo. Ora per gli Zebras la strada si fa in salita: saranno costretti a fare punti nella prossima giornata per continuare a sperare nella Final Four."]}, {"id": 85, "t": "SS ANNUNZIATA TRAVOLGENTE: ZIWONDELLO KO 10-1!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/FULL%20TIME.jpg", "meta": "🏆1^GIORNATA - 29/03/2025 ore 21:00SS ANNUNZIATA vs ZIWOONDELLO10-1", "data": "29/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["Il secondo match di giornata non ha storia: SS Annunziata domina e travolge Ziwondello, apparso ancora in fase di rodaggio e poco organizzato.", "L’avvio è persino equilibrato, con un botta e risposta iniziale che fissa il punteggio sull’1-1, lasciando presagire una gara combattuta. Ma è solo un'illusione. SS Annunziata prende rapidamente il controllo del match e chiude la prima frazione con un netto 7-1, mettendo in cassaforte la vittoria già all’intervallo.", "Nella ripresa, Ziwondello prova a reagire, guadagnando anche un calcio di rigore, ma il portiere Messia si supera con una parata straordinaria, blindando la porta e meritando il titolo di MVP di giornata grazie a interventi decisivi e grande sicurezza tra i pali.", "In attacco, brilla Colucci, autore di quattro reti, mentre Semeraro si distingue per la sua duttilità e la solita solidità in entrambe le fasi di gioco.", "Con questa vittoria schiacciante, SS Annunziata lancia un segnale forte al torneo: sarà la squadra da battere? Ziwondello, invece, dovrà lasciarsi subito alle spalle questa serata e concentrarsi sul prossimo impegno."]}, {"id": 86, "t": "l Piccolo Principe rimonta e vince all'esordio!", "img": "https://f2x9b.emailsp.com/documenti/1/ppcib.jpg", "meta": "🏆1^GIORNATA - 29/03/2025 ore 20:00IL PICCOLO PRINCIPE vs CIBANDOREVENTI7-3", "data": "29/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "under", "p": ["l match d’esordio della WEB CUP 25 ha visto protagonisti IL PICCOLO PRINCIPE e CIBANDOREVENTI.", "La squadra di quest’ultima parte subito forte, con un uno-due micidiale firmato da Campanella e Grottini che consente a Cibandoreventi di prendere il comando.", "Nonostante un inizio promettente, gli uomini in maglia nera riescono a mantenere il vantaggio per buona parte del primo tempo, complice anche una serie di splendidi interventi da parte dell’MVP di giornata, il portiere Conserva.", "Quando la partita sembra essere ben indirizzata, è Il Piccolo Principe a prendere il controllo. Grazie ad una grande prestazione di Marangi, che accorcia le distanze nel momento più cruciale, la squadra cambia volto e sembra aver trovato la chiave della partita.", "Il primo tempo si conclude in parità (Salamina F.), con la sensazione che il vento stia cambiando.", "Nella ripresa, Cibandoreventi paga un evidente calo fisico e Il Piccolo Principe ne approfitta immediatamente. I gol si susseguono in rapida successione, portando la squadra a distanziare sempre di più gli avversari.", "Gloria persino per Sannelli, il portiere, firma una rete con un destro incrociato da fuori area, aggiungendo il suo nome nel tabellino marcatori.", "Nel finale, Carbotti è uno degli ultimi a mollare e mette a segno un gol che rende meno amaro il risultato finale, ma non basta.", "Il Piccolo Principe si impone per 7-3, conquistando così i primi 3 punti della competizione.", "Buona la prestazione di Cibandoreventi per oltre metà gara, caratterizzata da grande intensità, ma la gestione dei cambi e delle risorse in campo rimane un aspetto su cui riflettere. Il cammino è appena iniziato!"]}, {"id": 87, "t": "Caroli Elettronica ruggisce subito: travolte le Zebras 9-4!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/TECSAM.jpg", "meta": "🏆1^GIORNATA - 23/03/2025 ore 09:30CAROLI ELETTRONICA vs ZEBRAS9-4", "data": "23/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Caroli Elettronica riparte da dove aveva lasciato.", "I Blues inaugurano la nuova edizione della WEB CUP con un roboante 9-4 ai danni delle Zebras, mettendo subito in chiaro le intenzioni: puntare al titolo sfumato solo ai rigori lo scorso anno.", "Partenza lampo per i ragazzi di Caroli, che dopo pochi minuti sono già sul 4-0 grazie alle micidiali combinazioni del tandem offensivo Palese-Lacatena (capocannoniere 2024), imprendibili in avvio.", "Zebras in grande difficoltà, ma a scuoterle è il loro numero 10 Caramia, che con orgoglio e qualità prova a riaccendere la luce.", "Non basta però la sua prova da leader, coronata da ben quattro reti, per arginare la furia dei Blues: Albanese, autore di una solida doppietta, chiude di fatto i giochi, mentre nel finale c’è gloria anche per Buonfrate, che sigla il gol della festa.", "Caroli Elettronica manda un chiaro messaggio alle rivali: la squadra c’è, è affamata e non ha dimenticato nulla.", "Le Zebras, seppur punite nel punteggio, trovano in Caramia un punto fermo da cui ripartire subito già dal prossimo match di sabato.", "La caccia al titolo è ufficialmente aperta."]}, {"id": 88, "t": "Il Palmento rallenta, i Red Devils ringhiano: è subito battaglia!", "img": "https://f2x9b.emailsp.com/documenti/1/red%20pal.jpg", "meta": "🏆1^GIORNATA - 23/03/2025 ore 08:30IL PALMENTO vs RED DEVILS2-2", "data": "23/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["Nella gara inaugurale della domenica, i Campioni in carica de Il Palmento impattano 2-2 contro i coriacei Red Devils, in una sfida equilibrata e ricca di spunti. La prima giornata si apre dunque con un pareggio che lascia aperti tutti i giochi, ma che premia il carattere e la voglia di entrambe le formazioni.", "Nel primo tempo sono i Red Devils a mettere subito le cose in chiaro: organizzazione, ritmo e soprattutto un Santoro in gran spolvero, sfortunatissimo però nel trovare due volte i legni a negargli la gioia del gol.", "A rompere l’equilibrio ci pensa il numero 10 e capitano dei Reds, Devito, che firma il vantaggio con una serpentina da applausi e un mancino chirurgico che non lascia scampo.", "La reazione dei campioni non si fa attendere: Il Palmento alza il baricentro e trova il pareggio con il solito Minardi, leader dei campioni, che riporta la sfida in parità.", "Pronti via e sono ancora i Red Devils a colpire: stavolta è Chieppa a mettere la firma, tra i migliori in campo, con una giocata di grande intelligenza che riporta avanti i suoi.", "Ma è nel secondo tempo che sale in cattedra l’uomo che cambierà il volto del match: Marangi, nominato MVP della gara. Lotta su ogni pallone, non molla mai e crede in un episodio che fa la differenza.", "Un’indecisione tra Venere e Montinaro regala infatti al numero di Il Palmento l’occasione per il definitivo 2-2, che punisce i Reds e salva i campioni da una falsa partenza.", "Nel finale poche emozioni, stanchezza visibile da entrambe le parti e un pareggio che, tutto sommato, soddisfa tutti.", "I Red Devils escono a testa altissima contro i campioni in carica, che invece sanno di dover ancora crescere, ma intanto portano a casa un punto che può fare morale.", "Un inizio di stagione col botto. Se il buongiorno si vede dal mattino… ne vedremo delle belle!"]}, {"id": 89, "t": "La TECSAM non sbaglia, ma Levaphone sorprende al debutto!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/1(23).jpg", "meta": "🏆1^GIORNATA - 22/03/2025 ore 16.00TECSAM vs LEVAPHONE7-4", "data": "22/03/2025", "anno": "2025", "comp": "WEB CUP", "cat": "over50", "p": ["È iniziata con grande spettacolo la WEB CUP 2025, che fin dal primo match ha regalato emozioni e intensità. A scendere in campo sono stati i campioni del 2023 della TECSAM e la Levaphone, squadra al debutto nella competizione, che ha dimostrato sin da subito di avere tutte le carte in regola per essere protagonista.", "Nonostante la sconfitta, i nuovi arrivati non hanno affatto sfigurato. Anzi, a tenere viva la speranza fino all’ultimo è stata la straordinaria prestazione di Tagliente, autore di una tripletta da applausi, vera spina nel fianco della difesa avversaria.", "Ma a salire ancora una volta in cattedra è stato Palazzo, già protagonista nella scorsa edizione e oggi autentico MVP del match. Gol, assist e giocate decisive: il fantasista della TECSAM ha trascinato i suoi con classe ed efficacia, confermandosi uomo chiave della formazione.", "La Levaphone, capitanata da Ruggieri e con in campo l’esperienza del veterano Giudiuli, ha mostrato organizzazione e spirito di squadra, ma non è riuscita a completare la rimonta. La sensazione, però, è che questa squadra potrà dire la sua nel prosieguo del torneo."]}, {"id": 90, "t": "Il cammino è appena iniziato, ma lo spettacolo è già di altissimo livello. La WEB CUP 2025 promette scintille", "img": "https://f2x9b.emailsp.com/documenti/1/202%20(1).jpg", "meta": "", "data": "", "anno": "", "comp": "WEB CUP", "cat": null, "p": []}, {"id": 91, "t": "PIZZE E DELIZIE CAMPIONI!WEB CUP 2024!", "img": "https://f2x9b.emailsp.com/documenti/1/CHAMPIONS.jpg", "meta": "🏆FINAL FOUR- FINALISSIMA02/06/2024 ore 19:00PIZZE E DELIZIE - CAROLI ELETTRONICA1-1 (5-4 d.c.r)", "data": "02/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Una finale thrilling e ricca di emozioni ha regalato la vittoria della WEB CUP 2024 a Pizze e Delizie, che ha superato Caroli Elettronica ai calci di rigore dopo un match molto equilibrato terminato 1-1.", "La partita è stata sin dall'inizio una battaglia serrata, con entrambe le squadre determinate a conquistare il trofeo. PIZZE E DELIZIE parte subito forte, con diverse occasioni da rete non sfruttate anche grazie all'estremo difensore di CAROLI.", "Portiere che è costretto al cambio nella prima frazione per un problema muscolare, tra i pali al suo posto andrà RUGGIERI che ricopre degnamente il ruolo senza sfigurare.", "Caroli Elettronica non si lascia abbattere e reagisce con grinta, mettendo sotto pressione la difesa avversaria con ottime ripartenze manovrate da ALBANESE e LACATENA.", "Primo tempo che si è conclude sul punteggio di 0-0, molto tattica e con molti falli a centrocampo per spezzare il ritmo.", "Secondo tempo ricco di emozioni", "Nella seconda frazione, la partita si è accesa, gli animi si sono scaldati e non sono mancate le emozioni.", "Caroli Elettronica passa in vantaggio grazie a un gol del capocannoniere del torneo, Lacatena.", "Il quale ha avuto filo da torcere grazie alla grande marcatura Difensiva di MINARDI.", "Pizze e Delizie, dopo il gol subito non si arrende, continua ad attaccare alla ricerca del Gol e difatti conquista un fondamentale calcio di rigore.", "ZAURINO con esperienza e freddezza lo trasforma e rimette tutto in parità.", "PIZZE E DELIZIE cala nel finale mentre CAROLI ELETTRONICA con un forcing finale , crea un’ occasionissima sul finale dove ALBANESE serve un assist perfetto a LACATENA che questa volta si fa ipnotizzare dal portiere.", "Sono dunque i calci di rigore che decideranno la vincitrice della WEB CUP 2024", "Dal dischetto calciano tutti, decisivo è l'errore di CARAMIA che condanna CAROLI alla prima sconfitta della WEB CUP , nel match più importante.", "PIZZE E DELIZIE festeggiano e contro ogni pronostico si aggiudicano la seconda edizione della WEB CUP  dimostrando grinta, orgoglio e unione di squadra!", "Una vittoria meritata", "Un plauso va anche a Caroli Elettronica, che ha disputato un'ottima finale e ha dato filo da torcere a Pizze e Delizie. La WEB CUP 2024 è stata un grande successo, con partite emozionanti e FINAL FOUR ricche di emozioni!Un'atmosfera fantastica.", "Complimenti e grazie a tutti i protagonisti!"]}, {"id": 92, "t": "TECSAM CONQUISTA IL BRONZO ALLA WEB CUP 2024: I RED DEVILS CEDONO AL SECONDO TEMPO", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/TERZI(0).jpg", "meta": "🏆FINAL FOUR- FINALE 3° E 4° POSTO02/06/2024 ore 18:00RED DEVILS - TECSAM 4-7", "data": "02/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["I campioni in carica della TECSAM si aggiudicano la medaglia di bronzo alla WEB CUP 2024, battendo i RED DEVILS per 7-4 nella finale per il terzo e quarto posto.", "La partita è stata equilibrata per buona parte del primo tempo, con i RED DEVILS che partono forte, portandosi in vantaggio per 2-0. Tuttavia, dopo una mezz'ora di gioco, i cambi effettuati dalla TECSAM e un calo fisico dei REDS hanno permesso ai campioni del 2023 di ribaltare la situazione e prendere il controllo del match.", "Tra i RED DEVILS si distinguono le prestazioni di DEVITO e MARINUZZI, autore di un gran gol da metà campo. Per la TECSAM, invece, il ritorno del portiere titolare e l'intesa tra CONTE e PALAZZO sono stati decisivi per il cambio di passo nella seconda frazione di gioco.", "Nonostante l'ambizione di un piazzamento migliore, la TECSAM può comunque ritenersi soddisfatta del bronzo conquistato. I RED DEVILS, invece, chiudono la WEB CUP con un crescendo di prestazioni, mostrando ampi margini di miglioramento.", "Considerando la scelta di non schierare alcun under e di non aver rinforzato la rosa durante il mercato estivo, nonostante alcune assenze importanti come quella di SCIALPI, il quarto posto è un risultato più che positivo per la squadra.", "Entrambe le squadre possono guardare con fiducia al futuro, pronte a contendersi il titolo nella prossima edizione della WEB CUP."]}, {"id": 93, "t": "FINALE STELLARE ALLA WEB CUP 2024!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/GIIFF.gif", "meta": "🏆FINAL FOUR- FINALISSIMA02/06/2024 ore 19:00PIZZE E DELIZIE - CAROLI ELETTRONICA", "data": "02/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Domenica 4 Giugno si terrà la Finalissima della Web Cup 2024!A contendersi il trofeo saranno Pizze e Delizie e Caroli Elettronica, due squadre che si sono strameritate questa splendida FINALE!", "Caroli Elettronica, squadra favorita del torneo fin dalle prime battute, ha confermato le aspettative arrivando alla finale senza mai perdere una partita. Il loro punto di forza? Un attacco stellare guidato da Lacatena, capocannoniere al momento del torneo con ben 17 reti all’attivo.", "Tuttavia, la semifinale di ieri ha visto Caroli Elettronica soffrire più del previsto, vincendo solo all'ultimo minuto. La finale sarà dunque un'occasione per riscattare la prestazione non impeccabile e conquistare il tanto ambito trofeo.", "Pizze e Delizie, invece, si sono presentate al torneo come vere e proprie outsider. Rinforzate nella sessione di mercato, hanno stupito tutti eliminando in semifinale i campioni in carica. Il loro gioco corale e la loro tenacia li rendono una squadra imprevedibile e pericolosa per chiunque.", "La sfida si preannuncia dunque equilibrata e incerta. I pronostici dei bookmaker tendono leggermente dalla parte di Caroli Elettronica, ma Pizze e Delizie sono pronte a dare battaglia fino all'ultimo minuto per sovvertire le previsioni e conquistare il loro primo titolo della WEB CUP!", "Non mancheranno emozioni e spettacolo per questa finalissima che si preannuncia come un vero e proprio match da non perdere. Appuntamento a Domenica 2 Giugno, ore 19:00 allo SPORTING CLUB per scoprire chi sarà la regina della Web Cup 2024!", "In bocca al lupo a entrambe le squadre!"]}, {"id": 94, "t": "RED DEVILS e TECSAM si sfidano per il terzo posto!", "img": "https://f2x9b.emailsp.com/documenti/1/GIFFFF%203%20E%204.gif", "meta": "🏆FINAL FOUR- FINALE 3° E 4° POSTO02/06/2024 ore 18:00RED DEVILS - TECSAM", "data": "02/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Si concluderà oggi la WEB CUP (Calcio) 2024 con la sfida valida per il terzo e quarto posto tra i RED DEVILS e la TECSAM, entrambe sconfitte nelle rispettive semifinali.", "I RED DEVILS, dopo la sfortunata sconfitta per 4-3 arrivata negli ultimi minuti di gioco contro gli imbattuti del torneo CAROLI ELETTRONICA, cercheranno di riscattare il risultato conquistando un terzo posto che significherebbe il miglior piazzamento di sempre nella competizione. La squadra, apparsa molto unita ieri sera, ha sfiorato l'impresa contro i campioni in carica, dimostrando grande carattere e tenacia.", "Dall'altra parte la TECSAM, detentrice del titolo, non potrà difendere il trofeo ma vorrà senz'altro ben figurare in questa ultima partita. I campioni uscenti, sconfitti per 6-3 PIZZE E DELIZIE, hanno comunque dimostrato il loro valore durante il torneo, mostrando un gioco solido e convincente.", "Si prospetta quindi una gara interessante e combattuta, con i RED DEVILS che cercheranno di sovvertire i pronostici e la TECSAM che punterà a chiudere la stagione con un piazzamento importante.", "La TECSAM partirà da favorita, ma i RED DEVILS, visti ieri sera, hanno tutte le carte in regola per dare filo da torcere agli avversari e conquistare un prestigioso terzo posto.", "L'appuntamento è per oggi alle ore 18:00 presso lo SPORTING CLUB."]}, {"id": 95, "t": "PIZZE E DELIZIE FANNO SALTARE IL BANCO: CAMPIONI IN CARICA ELIMINATI!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/PIZZE%20WIN.jpg", "meta": "🏆FINAL FOUR- SEMIFINALE01/06/2024 ore 19:00PIZZE E DELIZIE - TECSAM", "data": "01/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Serata da urlo per PIZZE E DELIZIE che, in un rocambolesco 6-3, si aggiudicano la seconda semifinale della WEB CUP 2024 eliminando i campioni in carica della TECSAM. La partita, ricca di emozioni e capovolgimenti di fronte, ha regalato spettacolo al numeroso pubblico presente.", "La TECSAM, priva del portiere titolare, parte subito fortissimo trascinata dai suoi attaccanti più prolifici: PALAZZO e CONTE portandosi sul 3-1.", "PIZZE E DELIZIE però non si arrende e, soprattutto nella ripresa, mette in campo una grinta e una determinazione da vera finalista.", "Il protagonista indiscusso del ribaltone è CASSANO, autore di una tripletta fantastica che trascina la sua squadra alla vittoria. La TECSAM prova a reagire, ma PIZZE E DELIZIE resiste e conquista il meritatissimo posto nella finalissima contro CAROLI ELETTRONICA.", "Delusione TECSAM: I campioni in carica escono di scena con un pizzico di rammarico.", "L’assenza del portiere titolare ed i tanti errori tecnici hanno influito sull’epilogo del match."]}, {"id": 96, "t": "CAROLI ELETTRONICA VINCE LA PRIMA SEMIFINALE: 4-3 AI RED DEVILS!", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/CAROLI%20WIN.jpg", "meta": "🏆FINAL FOUR- SEMIFINALE01/06/2024 ore 18:00CAROLI ELETTRONICA - RED DEVILS", "data": "01/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Una partita emozionante e ricca di rovesciamenti di fronte porta la CAROLI ELETTRONICA in finale della WEB CUP 2024.", "Ieri si è giocata la prima semifinale delle FINAL FOUR della WEB CUP 2024, e non ha deluso le aspettative. La CAROLI ELETTRONICA, imbattuta finora, ha dovuto faticare non poco per superare i RED DEVILS, che hanno dato filo da torcere fino all'ultimo minuto.", "La partita è iniziata subito a favore dei favoriti della CAROLI ELETTRONICA, che si sono portati sul 3-0 grazie ad un inizio folgorante. I RED DEVILS però non si sono arresi e, spinti da un grande VENERE autore di una tripletta, hanno riacciuffato la parità sul 3-3.", "A quel punto è emersa la figura di RUGGIERI, autore di una prestazione superlativa in marcatura su OTTAVIANO, il capocannoniere del torneo, che oggi non è riuscito a mettere il suo nome nel tabellino. Da sottolineare anche la prova di CARBOTTI, il portiere REDS ha brillato tra i pali con tante parate decisive.", "Nonostante la grande prova di carattere, i RED DEVILS cedono al 4-3 finale grazie ad una doppietta di ALBANESE, nominato MVP della partita.", "Una sconfitta immeritata per i RED DEVILS, che escono dal campo tra gli applausi e con la consapevolezza di aver disputato una grande partita.", "Dall'altra parte, la CAROLI ELETTRONICA festeggia il passaggio in finale, consapevole di aver trovato un avversario ostico e di dover dare il massimo per conquistare il trofeo.", "Una semifinale spettacolare che ha dato il via alle fasi finali della WEB CUP 2024, che promette di regalare ancora grandi emozioni."]}, {"id": 97, "t": "TECSAM E PIZZE E DELIZIE PRONTE PER LA SEMIFINALE!", "img": "https://f2x9b.emailsp.com/documenti/1/SEMIFINALE%202.gif", "meta": "🏆FINAL FOUR- SEMIFINALE01/06/2024 ore 19:00PIZZE e DELIZIE vs TECSAM", "data": "01/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Sabato alle 19:00 si terrà la seconda semifinale della Seconda edizione della WEB CUP 2024, che vedrà fronteggiarsi Tecsam, campione in carica, e Pizze e Delizie. Si prospetta una gara equilibrata e ricca di emozioni, come già dimostrato dal match della fase a gironi.", "Tecsam, reduce da un girone di qualificazione solido, si presenta con la stessa formazione che ha conquistato il passaggio del turno;", "Non avendo usufruito della finestra di mercato, L Tecsam punterà tutto sull'esperienza e sul gioco collaudato dei suoi dieci giocatori per bissare il successo dello scorso anno.", "Pizze e Delizie, invece, hanno dovuto affrontare un finale di stagione complicato, complici  infortuni che hanno condizionato il rendimento della squadra. Per ovviare a questa situazione, la società ha deciso di intervenire sul mercato con due acquisti di valore: Braccioforte e Carrieri. Due innesti importanti che alzano l’asticella della squadra e che potrebbero rivelarsi decisivi per il match di sabato.", "Sulla carta, Tecsam parte come favorita, forte del suo titolo di campione in carica e di un gruppo affiatato. Pizze e Delizie, però, non è da sottovalutare. I due nuovi acquisti e la voglia di riscatto dopo un finale di stagione difficile potrebbero dare la spinta giusta per sovvertire i pronostici e centrare l'accesso alla finale.", "L'appuntamento è per sabato alle 19:00 allo Sporting Club."]}, {"id": 98, "t": "FINAL FOUR AL VIA! CAROLI SUPERFAVORITA CONTRO I REDS", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/SEMIFINALE%201.gif", "meta": "🏆FINAL FOUR- SEMIFINALE01/06/2024 ore 18:00CAROLI ELETTRONICA vs RED DEVILS", "data": "01/06/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Sabato alle 18:00 al via le attesissime FINAL FOUR della Seconda Edizione della WEB CUP 2024. La prima SEMIFINALE vedrà contrapposte la Caroli Elettronica, prima classificata nel girone, e i Red Devils, quarti classificati.", "Caroli Elettronica, imbattuta durante la fase a Girone, si presenta al match come grande favorita per l'accesso alla finale. La squadra ha ulteriormente rinforzato il proprio già solido organico durante la. Finestra di mercato con gli arrivi di Marangi e Carovigno, quest'ultimo strappato alla Fontanina.", "I Red Devils, invece, si sono qualificati alla fase finale per il rotto di un capello, ma sono pronti a dare il massimo per stupire e centrare un'impresa storica contro favori del pronostico. La squadra non ha effettuato nessun innesto durante la sessione di mercato, confermando in toto la rosa.", "I numeri raccontano di un divario netto tra le due formazioni. La Caroli Elettronica vanta il miglior attacco del torneo, mentre i Red Devils hanno la peggior difesa.", "Tuttavia, come spesso accade nel calcio, anche le partite sulla carta più scontate possono riservare sorprese. I Red Devils non hanno nulla da perdere e venderanno cara la pelle, mentre la Caroli Elettronica dovrà gestire la pressione di essere la favorita e non sottovalutare l'avversario.", "L'appuntamento è per sabato alle 18:00!"]}, {"id": 99, "t": "FONTANINA IL CUORE NON BASTA,REDS ALLE FINAL FOUR!", "img": "https://f2x9b.emailsp.com/documenti/1/POST%205%202.jpg", "meta": "🏆5^GIORNATA - 28/04/2024 ore 9.30LA FONTANINA vs RED DEVILS", "data": "28/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Nella quinta e ultima giornata della fase a gironi della Web Cup 2024, gli occhi sono tutti puntati sul match mozzafiato tra i Red Devils e La Fontanina.", "Il risultato finale, 7-6 in favore de La Fontanina.", "Per La Fontanina, era una partita cruciale. Dovevano vincere con almeno due gol di scarto per garantirsi un posto nelle Final Four. Nonostante un inizio incerto che li ha visti costretti a inseguire per gran parte del match, la squadra ha mostrato una grinta e una determinazione senza pari.", "Negli ultimi minuti, La Fontanina ha dominato il campo, compiendo una rimonta incredibile da 5-6 ad un finale di 7-6, mancando per un soffio la qualificazione!. La loro grinta e voglia fino all'ultimo secondo è stata ammirevole, hanno dato vita ad un finale di match spettacolare!", "Giocatore chiave oggi per La Fontanina è stato Calella, eletto MVP del match!", "D'altra parte, i Red Devils sono stati padroni del loro destino per gran parte del gioco, mantenendo costantemente un vantaggio di un gol.", "Ruggieri ha tenuto saldamente la difesa, concedendo poco agli avversari.", "Follia negli ultimi dieci minuti, un black out totale ha permesso a La Fontanina di segnare ripetutamente e rimettere in bilico la qualificazione.", "4 sostituzioni in sequenza hanno provocato un brusco cambio di ritmo e si sono visti sfuggire la vittoria per un soffio.", "Red Devils staccano comunque il pass per le Final Four da quarti classificati, ma dovranno riflettere su questo risultato e concentrarsi su come migliorare per affrontare in semifinale la squadra imbattuta del torneo."]}, {"id": 100, "t": "CAROLI ELETTRONICA FA 4/4, ma Pizze e Delizie è alle Final 4", "img": "https://f2x9b.emailsp.com/documenti/ConsoleDocuments/POST%205%201.jpg", "meta": "🏆5^GIORNATA - 28/04/2024 ore 8.30CAROLI ELETTRONICA vs PIZZE e DELIZIE", "data": "28/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Nella quinta e ultima giornata della fase a gironi della WEB CUP 2024, la squadra CAROLI ELETTRONICA ha ottenuto la quarta vittoria consecutiva contro PIZZE e DELIZIE, consolidando la loro posizione di capolista imbattuta a punteggio pieno!", "Il match, disputato questa mattina, si è concluso con un risultato di 4-2 a favore dei CAROLI ELETTRONICA, grazie soprattutto alla brillante performance di Lacatena, che si è aggiudicato il titolo di MVP per la seconda volta consecutiva. Con una tripletta magistrale, Lacatena ha saputo mettere al sicuro il risultato per la sua squadra.", "Da non sottovalutare anche il contributo di Marangi, il cui impegno e versatilità tra i pali hanno contribuito al successo della squadra.", "Dall'altra parte del campo, nonostante la sconfitta, PIZZE e DELIZIE hanno dato prova di grande determinazione, giocando con soli cinque uomini e senza possibilità di sostituzioni. Il loro impegno, sacrificio e spirito di squadra non sono passati inosservati, e nonostante le avversità, hanno ottenuto comunque il pass per le tanto agognate Final Four.", "Un plauso speciale va a Minardi, il cui spirito di leadership è rimasto intatto nonostante un infortunio che lo ha costretto a ricoprire i panni di Portiere.", "Il suo supporto morale è stato fondamentale per mantenere alta la concentrazione dei suoi compagni di squadra."]}, {"id": 103, "t": "CAROLI ELETTRONICA INARRESTABILE!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1713727586_3351312357752359868_60377131188.jpg", "meta": "🏆4^GIORNATA - 21-04-2024✅Continua la marcia trionfale della Capolista CAROLI ELETTRONICA nella WEB CUP. La squadra ha travolto stamattina La Fontanina con un sonoro 11-5, conquistando la terza vittoria consecutiva nel torneo e consolidando il primo posto in classifica!⚽️Protagonista assoluto della gara è stato ancora una volta il bomber Lacatena, autore di ben 7 reti e capocannoniere del torneo con 14 gol all’attivo. Lacatena ha trascinato i suoi compagni di squadra con giocate di fino e fiuto del gol, rendendo inutili i tentativi di rimonta della Fontanina.🧤Oltre a Lacatena, ha brillato anche il portiere “Leo”, eletto MVP della partita. Leo è stato decisivo nel respingere i numerosi tiri della Fontanina, soprattutto nel secondo tempo quando la sua squadra ha dovuto gestire e difendere il risultato.La Fontanina, nonostante la sconfitta, ha comunque mostrato una buona reazione, non era semplice dopo l’avvio shock.La squadra in rosso ha pagato a caro prezzo alcuni errori difensivi e soprattutto la mancanza di cinismo in zona gol con moltissimi legni colpiti.Con questa sconfitta, La Fontanina rimane ancora a secco di punti in classifica, ma non dice ancora addio al sogno di qualificarsi per le final four. Per centrare questo obiettivo, dovranno vincere l’ultima giornata e sperare in un risultato favorevole nell’altra partita del girone. Il destino, però, non è più nelle loro mani.", "data": "21/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": []}, {"id": 104, "t": "TECSAM ALLE FINAL FOUR!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1713635959_3350543733735397752_60377131188.jpg", "meta": "🏆 4^GIORNATA - 20-04-2024 -", "data": "20/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["💪🏻La TECSAM vince, vola al primo posto momentaneo e stacca il PASS🎟️ per le FINAL FOUR di Giugno!", "Seconda vittoria consecutiva per i campioni in carica che trovano un FERRI in grande spolvero, autore di una grande tripletta.Standing ovation per il portiere “Tecsaniano” ZITO (migliore in campo). Ci pensa lui a chiudere la saracinesca e concedere poco e nulla agli avversari.🚩Red Devils rimaneggiati e ridotti ai minimi termini a causa di infortuni e indisponibilità.I sei convocati sbattono sul muro avversario e traballano in fase difensiva.Risultato un po’ bugiardo per quanto visto in campo ma adesso la qualificazione non è così scontata..."]}, {"id": 105, "t": "TECSAM VINCE e CONVINCE!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1713174070_3346669126045460112_60377131188.jpg", "meta": "🏆3^GIORNATA - 20-04-2024", "data": "20/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Seconda vittoria e prestazione convincente per la TECSAM.🎽Ritrovato il miglior CONTE autore di un fantastico POKER e di una prestazione ben sopra le righe a scapito della FONTANINA, ancora a secco di punti in questa prima fase.Partita avvincente, dove la TECSAM è parsa averne sempre il controllo.Buoni squilli di TAGLIENTE per LA FONTANINA, ma non è bastato ad impedire la seconda sconfitta consecutiva."]}, {"id": 106, "t": "SUPER REDS!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1713173594_3346665134880029626_60377131188.jpg", "meta": "🏆3^GIORNATA - 20-04-2024", "data": "20/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["🛑Vincono e convincono i RED DEVILS nella seconda uscita stagionale!Una grande prestazione di squadra, con spirito di sacrificio permette di incassare i primi 3 punti del torneo a scapito di PIZZE E DELIZIE, apparsi un pò stanchi e poco brillanti.Da sottolineare la grande prestazione di SCIALPI, MVP della partita, che insieme al letale INDELICATO autore di 4 reti, hanno trascinato i Diavoli Rossi al successo, rilanciandosi così per un posto tra le prime 4."]}, {"id": 107, "t": "CAROLI A PUNTEGGIO PIENO!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1712509124_3341091152604775172_60377131188.jpg", "meta": "🏆2^GIORNATA - 07-04-2024", "data": "07/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["Nella mattinata di Domenica sono scese in campo TECSAM contro CAROLI ELETTRONICA.Entrambe le squadre rimaneggiate a causa infortuni, ma non sono mancate le scintille ⚔️ in un match duro ed equilibrato.Per i campioni in carica non basta la tripletta di PALAZZO per evitare la prima sconfitta stagionale;Un gran lavoro di squadra permette a CAROLI ELETTRONICA di guadagnare 3 punti importantissimi e staccare le altre andandosi a prendere il PRIMO POSTO in classifica!👏🏼Un applauso a MIMMO PALESE che dopo lo spavento di qualche settimana fa, ha seguito dalla panchina i propri compagni."]}, {"id": 108, "t": "PIZZE e DELIZI-osi!!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1712508689_3341087506337103632_60377131188.jpg", "meta": "🏆2^GIORNATA - 06-04-2024", "data": "06/04/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["☀️in un caldo Sabato Pomeriggio di Aprile, scendono in campo PIZZE E DELIZIE contro LA FONTANINA.Gara per la prima parte equilibrata, ma a far la differenza è la prestazione sontuosa di MINARDI che con una tripletta incanala la partita dalla propria parte.Esordio amaro della FONTANINA che si sveglia tardi siglando 3 reti consecutive nel finale, rendendo meno pesante il passivo ed aggrappandosi momentaneamente al 4°Posto in classifica.Risultato finale di 7-3 per PIZZE E DELIZIE"]}, {"id": 109, "t": "RINCORSA AL SECONDO TITOLO!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1711361452_3331463786018430289_60377131188.jpg", "meta": "🏆1^GIORNATA - 31-03-2024", "data": "31/03/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": ["I Campioni in Carica della TECSAM scendono subito in campo alla difesa del Titolo;⚽Grande intensità nel secondo match di giornata, ne esce vittoriosa la TECSAM, squadra campione in carica che dopo una prima parte di gara di enorme difficoltà nello sbloccarsi, mette la freccia nei minuti finali e vince per 4-2 su PIZZE E DELIZIE , che hanno avuto il merito di rimanere in partita fino alla fine."]}, {"id": 110, "t": "CAROLI ELETTRONICA PORTANO I RED DEVILS ALL'INFERNO!", "img": "https://f2x9b.emailsp.com/documenti/1/webcup2024_1711360942_3331459502585444487_60377131188.jpg", "meta": "🏆1^GIORNATA - 31-03-2024", "data": "31/03/2024", "anno": "2024", "comp": "WEB CUP", "cat": "over50", "p": []}];

/* ============ CALCOLI AUTOMATICI ============ */
const parseM = s => (s||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s+(\d+)$/); return m?[m[1],+m[2]]:[x,1];});
const giocate = c => c.partite.filter(p=>p.gc!=null);
function classifica(c,squadre,girone){
  const t={}; squadre.forEach(s=>t[s]={s,g:0,v:0,n:0,p:0,gf:0,gs:0,pt:0});
  giocate(c).filter(p=>p.fase==="Girone" && (!girone||p.girone===girone)).forEach(p=>{
    const a=t[p.casa], b=t[p.ospite]; if(!a||!b) return; a.g++; b.g++;
    a.gf+=p.gc; a.gs+=p.go; b.gf+=p.go; b.gs+=p.gc;
    if(p.gc>p.go){a.v++;b.p++;a.pt+=3}else if(p.gc<p.go){b.v++;a.p++;b.pt+=3}else{a.n++;b.n++;a.pt++;b.pt++}
  });
  /* classifica avulsa: punti, scontri diretti, differenza reti, goal fatti, goal subiti */
  const gm=giocate(c).filter(p=>p.fase==="Girone" && (!girone||p.girone===girone));
  const h2h=(x,grp)=>{let pt=0,dr=0; gm.forEach(p=>{ if(!grp.includes(p.casa)||!grp.includes(p.ospite)) return; if(p.casa!==x&&p.ospite!==x) return;
      const f=p.casa===x?p.gc:p.go, s=p.casa===x?p.go:p.gc; dr+=f-s; pt+=f>s?3:f===s?1:0; }); return {pt,dr}; };
  const L=Object.values(t);
  L.forEach(r=>{ const grp=L.filter(o=>o.pt===r.pt).map(o=>o.s); const hh=h2h(r.s,grp); r.hp=hh.pt; r.hd=hh.dr; });
  return L.sort((x,y)=>y.pt-x.pt||y.hp-x.hp||y.hd-x.hd||(y.gf-y.gs)-(x.gf-x.gs)||y.gf-x.gf||x.gs-y.gs||x.s.localeCompare(y.s));
}
function marcatori(c){
  /* stesso nome in squadre diverse = giocatori diversi, salvo prestiti in fase finale */
  const gir={}; giocate(c).filter(p=>p.fase==="Girone").forEach(p=>[[0,p.casa],[1,p.ospite]].forEach(([i,sq])=>parseM(p.m&&p.m[i]).forEach(([n])=>{(gir[n]=gir[n]||new Set()).add(sq);})));
  const m={};
  giocate(c).forEach(p=>[[0,p.casa],[1,p.ospite]].forEach(([i,sq])=>parseM(p.m&&p.m[i]).forEach(([n,q])=>{
    if(/^autorete$/i.test(n)) return;
    let base=sq; const G=gir[n];
    if(p.fase!=="Girone" && G && !G.has(sq) && G.size===1) base=[...G][0];
    const k=n+"|"+base; m[k]=m[k]||{n,sq:[base],g:0}; m[k].g+=q; if(!m[k].sq.includes(sq)) m[k].sq.push(sq);
  })));
  return Object.values(m).sort((a,b)=>b.g-a.g||a.n.localeCompare(b.n));
}
function fotoPerNome(n){ if(typeof FOTO==="undefined") return ""; const k=Object.keys(FOTO).find(k=>k.split("|")[1]===n); return k?FOTO[k]:""; }
function fotoGiocatore(nome, clubs, RS=ROSE, pre=""){
  const ALIAS={"Palese Mimmo":"Palese Cosimo"}; nome=ALIAS[nome]||nome;
  if(typeof FOTO==="undefined") return "";
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z' ]/g,"").trim();
  const m=nome.match(/^(.*?)(?:\s+([A-Z])\.)?$/); const sur=norm(m[1]), ini=m[2]?m[2].toLowerCase():null;
  for(const c of clubs){ const r=RS[c]; if(!r) continue;
    const hit=r.map(x=>x.split("|")[0]).find(n=>{const nn=norm(n); return (nn===sur||nn.startsWith(sur+" ")) && (!ini||nn.slice(sur.length+1).startsWith(ini));});
    if(hit){ const f=FOTO[pre+c+"|"+hit]||fotoPerNome(hit); if(f) return f; } }
  if(CUR.noFb) return "";
  /* stesso nome e cognome in altre rose: stessa foto (solo se il cognome è univoco) */
  const cand=Object.keys(FOTO).filter(k=>{const nn=norm(k.split("|")[1]); return (nn===sur||nn.startsWith(sur+" ")) && (!ini||nn.slice(sur.length+1).startsWith(ini));});
  const nomi=[...new Set(cand.map(k=>k.split("|")[1]))];
  return nomi.length===1 ? FOTO[cand[0]] : "";
}

/* ============ GIUDICE SPORTIVO (calcolo automatico diffide e squalifiche) ============ */
const REGOLE_DISCIPLINA = [
  "Alla 2ª ammonizione il giocatore entra in diffida.",
  "Alla 3ª ammonizione scatta 1 giornata di squalifica.",
  "Espulsione (rosso diretto o doppia ammonizione): il giocatore salta la gara successiva.",
  "Per comportamento violento o antisportivo l'organizzazione si riserva di decidere ulteriori giornate di squalifica.",
  "Al termine della fase a gironi le ammonizioni vengono azzerate."
];
const stepLabel = s => typeof s==="number" ? s+"ª giornata" : (s==="Semifinale"?"Semifinali":"Finali");
/* tappe della competizione: giornate giocate, poi semifinali e finali */
function tappe(c){
  const pl=giocate(c), out=[];
  [...new Set(pl.filter(p=>p.fase==="Girone").map(p=>p.g))].sort((a,b)=>a-b).forEach(g=>out.push(g));
  if(pl.some(p=>p.fase==="Semifinale")) out.push("Semifinale");
  if(pl.some(p=>p.fase==="Finale"||p.fase==="Finale 3° posto")) out.push("Finale");
  return out;
}
function disciplina(c){
  const cnt={}, list=c.giudice||[], T=tappe(c), out=[];
  T.forEach((s,i)=>{
    if(s==="Semifinale") Object.keys(cnt).forEach(k=>cnt[k]=0);   /* azzeramento dopo i gironi */
    const x=list.find(e=>(e.g??e.fase)===s)||{};
    const amm=(x.amm||[]).map(([n,t])=>{const k=n+"|"+t; cnt[k]=(cnt[k]||0)+1; return {n,t,num:cnt[k]};});
    const esp=(x.esp||[]).map(([n,t,tipo])=>({n,t,tipo:tipo||"espulsione"}));
    const squal=[...esp.map(e=>({n:e.n,t:e.t,motivo:e.tipo})), ...amm.filter(a=>a.num>=3).map(a=>({n:a.n,t:a.t,motivo:"3ª ammonizione"}))];
    amm.filter(a=>a.num>=3).forEach(a=>{cnt[a.n+"|"+a.t]=0;});
    (x.extra||[]).forEach(e=>squal.push({n:e[0],t:e[1],motivo:e[2]}));
    const diff=Object.entries(cnt).filter(([k,v])=>v===2).map(([k])=>{const [n,t]=k.split("|"); return {n,t};});
    const next=T[i+1]; const prossima = next===undefined ? "gara successiva" : (typeof next==="number"? next+"ª giornata" : next==="Semifinale"?"semifinale":"finale");
    out.push({s, amm, esp, squal, diff, prossima});
  });
  return out;
}

  return `<div class="cu">

function giudice(cat){
  const C=CAT[cat]; CUR.pre="";
  const logoG=(typeof TROFEI!=="undefined"&&TROFEI["giudice"])||"";
  const righe=[];
  Object.entries(COMP).forEach(([k,X],ci)=>{
    const c=DATA[cat+"/"+k]; if(!c || !giocate(c).length) return;
    const RS=c.rose?eval(c.rose):ROSE, tro=TROFEO(k,cat);
    disciplina(c).forEach((r,i)=>righe.push({r,X,c,RS,pre:c.fotoPre||"",tro,ord:ci*100+i}));
  });
  /* più recenti in alto: Super Coppa, Mundialito, poi WEB CUP */
  righe.sort((a,b)=>b.ord-a.ord);
  const riga=(n,t,sub,cls,lbl)=>`<div class="pr">${avatar(n,[t])}<span class="pn2">${n}<small>${t}${sub?" · "+sub:""}</small></span><span class="tg ${cls}">${lbl}</span></div>`;
  const body=righe.map(({r,X,RS,pre,tro},i)=>{
    CUR.RS=RS; CUR.pre=pre;
    const parts=[...r.esp.map(e=>riga(e.n,e.t,e.tipo,"r","ESPULSO")), ...r.squal.map(s=>riga(s.n,s.t,s.motivo+" · salta la "+r.prossima,"r","SQUALIFICATO")),
      ...r.amm.map(a=>riga(a.n,a.t,a.num+"ª ammonizione","y","AMMONITO")), ...r.diff.map(s=>riga(s.n,s.t,"","d","DIFFIDATO"))];
    const badge = (r.esp.length?`<span class="tg r">${r.esp.length} esp.</span>`:"") + (r.amm.length?`<span class="tg y">${r.amm.length} amm.</span>`:"") || `<span class="tg ok">nessuna sanzione</span>`;
    const id="cu"+i;
    return `<details class="gs"><summary><span class="gs-tro">${tro?`<img src="${tro}" alt="">`:""}</span><span class="gs-n"><b>${X.nome}</b><small>Comunicato · ${stepLabel(r.s)}</small></span>${badge}</summary>
      <div class="gs-b">${parts.length?parts.join(""):`<div class="gs-ok">Nessuna sanzione disciplinare</div>`}
      <button class="cp" onclick="var e=document.getElementById('${id}');e.hidden=!e.hidden;this.textContent=e.hidden?'Visualizza comunicato':'Chiudi comunicato'">Visualizza comunicato</button>
      <div id="${id}" hidden>${comunicatoHTML(r,X,C,tro)}</div></div></details>`;
  }).join("");
  $(`${topbar("Giudice sportivo · "+C.nome,"go:calcio/"+cat)}
    <div class="premio-h">${logoG?`<img src="${logoG}" alt="" style="width:130px;height:auto;max-height:130px">`:""}<div class="h1">Giudice sportivo</div></div><div class="pill ${C.cls}">Calcio · ${C.nome}</div>
    <div class="regole"><b class="disc"><span class="cards"><i class="cd y"></i><i class="cd r"></i></span>Regolamento disciplinare</b><ul>${REGOLE_DISCIPLINA.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    ${body}`);
}

  const key=cat+"/"+comp, c=DATA[key], C=CAT[cat], X=COMP[cb(comp)];
  const RS=c.rose?eval(c.rose):ROSE, pre=c.fotoPre||""; CUR.RS=RS; CUR.pre=pre;
  setCurSq(cat,comp);
  const pill=`<div class="pill ${C.cls}">${X.nome} · ${C.nome}</div>`;
  const T=[["risultati","Risultati"]];
  if(hasGirone(c)) T.push(["classifica","Girone"]);
  if(giocate(c).length && !c.archivio) T.push(["marcatori","Marcatori"]);
  if(c.ballon||c.guanto||c.premiArchivio) T.push(["premi","Premi"]);
  const sqList=c.gironi?Object.values(c.gironi).flat():(c.squadre||[]);
  if(sqList.some(s=>RS[s])) T.push(["squadre","Squadre"]);
  const ALBO=(DATA[cat+"/"+cb(comp)]||{}).albo;
  const isAlbo=tab==="albo"&&!!ALBO;
  if(!isAlbo && !T.find(t=>t[0]===tab)) tab="risultati";
  let body="";
  if(tab==="risultati"){
    body=`<div class="ed">${c.edizione} · <b class="${c.stato==="Conclusa"?"ok":"live"}">${c.stato}</b></div>${podio(c)}${c.archivio?`<div class="note" style="text-align:center">Edizione d'archivio: risultati dalle grafiche ufficiali e dal Gazzettino; marcatori partita per partita non disponibili.</div>`:""}`;
    (c.stato==="Conclusa"?ORD_FASI:["Girone","Semifinale","Finale 3° posto","Finale"]).forEach(f=>{
      const ps=c.partite.filter(p=>p.fase===f); if(!ps.length) return;
      if(f==="Girone"){
        const gs=[...new Set(ps.map(p=>p.g))].sort((a,b)=>b-a);
        const tri=TROFEO_S(comp,cat)?`<img class="h1-tr" src="${TROFEO_S(comp,cat)}" alt="">`:"";
        gs.forEach(g=>{ body+=`<div class="h1">${tri}${g}^Giornata</div>${pill}`+ps.filter(p=>p.g===g).map(matchCard).join(""); });
      } else { const tri=TROFEO_S(comp,cat)?`<img class="h1-tr" src="${TROFEO_S(comp,cat)}" alt="">`:""; body+=`<div class="h1 ${f==="Finale"?"t-oro":f==="Finale 3° posto"?"t-bronzo":f==="Semifinale"?"t-cl":""}">${tri}${f}</div>${pill}`+ps.map(matchCard).join(""); }
    });
  }
  if(tab==="classifica"){
    if(c.gironi) body=Object.entries(c.gironi).map(([g,sq])=>{c._gir=g; const r=tabClassifica(c,sq,"Girone "+g,pill); c._gir=null; return r;}).join("");
    else body=tabClassifica(c,c.squadre,"Girone",pill);
    body+=legendaFF(c);
    body+=`<div class="note">Calcolata in automatico dai risultati del girone: 3 punti vittoria, 1 pareggio. A parità si applica la classifica avulsa: scontri diretti, differenza reti, goal fatti, goal subiti, fair play.</div>`;
  }
  if(tab==="marcatori" && c.marcatoriUfficiali){
    let pos=0,prev=null;
    body=`<div class="premio-h">${(typeof TROFEI!=="undefined"&&TROFEI["premio-scarpa"])?`<img src="${TROFEI["premio-scarpa"]}" alt="">`:""}<div class="h1">Capocannoniere</div></div>${pill}
    <div class="tbl"><table><tr><th>#</th><th style="text-align:left">Giocatore (Club)</th><th>Goal</th></tr>
    ${c.marcatoriUfficiali.map((r,i)=>{ if(r[2]!==prev){pos=i+1;prev=r[2];} return `<tr class="${i===0?"top1":""}"><td class="pos">${pos}</td><td class="n"><div class="pc"${GL(r[0],r[1].split(" / "))}>${avatar(r[0],r[1].split(" / "))}<span>${r[0]} <span class="club">(${r[1]})</span></span></div></td><td class="pts">${r[2]}</td></tr>`;}).join("")}
    </table></div><div class="note">Classifica marcatori ufficiale dell'edizione.</div>`;
  } else if(tab==="marcatori"){
    body=`<div class="premio-h">${(typeof TROFEI!=="undefined"&&TROFEI["premio-scarpa"])?`<img src="${TROFEI["premio-scarpa"]}" alt="">`:""}<div class="h1">Capocannoniere</div></div>${pill}
    <div class="tbl"><table><tr><th>#</th><th style="text-align:left">Giocatore (Club)</th><th>Goal</th></tr>
    ${marcatori(c).map((r,i)=>`<tr class="${i===0?"top1":""}"><td class="pos">${i+1}</td><td class="n"><div class="pc"${GL(r.n,r.sq)}>${avatar(r.n,r.sq)}<span>${r.n} <span class="club">(${r.sq.join(" / ")})</span></span></div></td><td class="pts">${r.g}</td></tr>`).join("")}
    </table></div><div class="note">Calcolata in automatico dai marcatori di ogni partita (girone e fase finale).</div>`;
  }
  if(tab==="premi" && c.premiArchivio){
    const tr=k=>(typeof TROFEI!=="undefined"&&TROFEI[k])||"";
    const L={ballon:["Pallone d'Oro","premio-ballon",""],guanto:["Guanto d'Oro","premio-guanto",""],capocannoniere:["Capocannoniere","premio-scarpa","👟"]};
    body=`<div class="h1">Premi ${annoDi(cat,comp)}</div>${pill}<div class="pa-list">${c.premiArchivio.map(p=>{const [t,img,emo]=L[p.premio]; const r=resolveG(p.nome,[p.team],cat)||p.nome; const ph=(typeof FOTO!=="undefined"&&fotoG(r))||"";
      return `<div class="pa"${GL(r,[p.team],cat)}><div class="pa-ic">${img&&tr(img)?`<img src="${tr(img)}" alt="">`:`<span>${emo}</span>`}</div><div class="pa-t"><small>${t}</small><b>${p.nome}</b><span>${logo(p.team,"mini")}${p.team}</span></div>${ph?`<img class="pa-ph" src="${ph}" alt="">`:`<span class="pa-ph sil"></span>`}</div>`;}).join("")}</div>
      <div class="note" style="text-align:center">Edizione d'archivio: sono riportati solo i vincitori dei premi.</div>`;
  } else if(tab==="premi"){
    const tr=k=>(typeof TROFEI!=="undefined"&&TROFEI[k])||"";
    if(c.ballon) body+=tabPremio(c.ballon,"Ballon d'Or","Calciatore",pill,tr("premio-ballon"),sqList);
    if(c.guanto) body+=tabPremio(c.guanto,"Guanto d'Oro","Portiere",pill,tr("premio-guanto"),sqList);
  }
  if(tab==="squadre"){
    const tag={C:'<span class="tg c">C</span>',U:'<span class="tg u">UNDER</span>',M:'<span class="tg m">MERCATO</span>'};
    body=`<div class="h1">Squadre</div>${pill}<div class="sq-list">${sqList.filter(s=>RS[s]).map(s=>`<a class="sq-row" href="#"${TL(s)}>${logo(s,"mini")}<b>${s}</b>${campione(c,s)&&stendardo(cat,comp)?`<img class="scudo-s" src="${stendardo(cat,comp)}" alt="Campione">`:""}<span class="nr">${RS[s].length} giocatori</span><span class="arr">›</span></a>`).join("")}</div><div class="note">Tocca una squadra per aprire la sua pagina: partite, marcatori e rosa.</div>`; if(false) body+=sqList.filter(s=>RS[s]).map(s=>`<details class="rosa"><summary>${logo(s,"mini")}<b>${s}</b><span class="nr">${RS[s].length} giocatori</span></summary>
      <div class="pl">${RS[s].map(x=>{const [n,...f]=x.split("|"); const note=f.filter(k=>k.startsWith("n:")).map(k=>k.slice(2)); const ph=(typeof FOTO!=="undefined"&&(FOTO[pre+s+"|"+n]||fotoPerNome(n)));
          return `<div class="pr"${GL(n,[s],cat)}>${ph?`<img class="av" src="${ph}" alt="${n}">`:`<span class="av sil"></span>`}<span class="pn2">${n}${note.length?`<small>${note.join(" · ")}</small>`:""}</span>${f.filter(k=>tag[k]).map(k=>tag[k]).join("")}</div>`;}).join("")}</div></details>`).join("")+
      `<div class="note">C = capitano · UNDER = fuori quota · MERCATO = arrivato col calciomercato.</div>`;
  }
  if(isAlbo){
    body=`<div class="h1">Albo d'oro</div>${pill}<div class="albo">${ALBO.slice().reverse().map(([a,s])=>`<div class="ar"${TL(s)}><span class="ay">${a}</span>${logo(s,"mini")}<span class="as">${s}</span></div>`).join("")}</div>`;
  }
  $(`${topbar(X.nome+" · "+C.nome,"go:calcio/"+cat)}
    ${(()=>{const base=cb(comp), eds=Object.keys(DATA).filter(k=>k.startsWith(cat+"/"+base+"@")).map(k=>k.split("@")[1]).sort((a,b)=>b-a); const albBtn=ALBO?`<a class="alb-btn ${isAlbo?"on":""}" href="#" data-go="calcio/${cat}/${base}/albo">🏆 Albo d'oro</a>`:""; if(!eds.length) return albBtn?`<div class="ed-sel">${albBtn}</div>`:""; const cur=isAlbo?"":comp.includes("@")?comp.split("@")[1]:((DATA[cat+"/"+base].edizione||"").match(/\d{4}/)||[""])[0];
      const all=[[((DATA[cat+"/"+base].edizione||"").match(/\d{4}/)||[""])[0],base],...eds.map(y=>[y,base+"@"+y])];
      return `<div class="ed-sel"><span>Edizione</span>${all.map(([y,k])=>`<a class="${y===cur?"on":""}" href="#" data-go="calcio/${cat}/${k}/${isAlbo?"risultati":tab}">${y}</a>`).join("")}${albBtn}</div>`;})()}
    ${isAlbo?"":`<div class="tabs">${T.map(([k,l])=>`<a class="${k===tab?"on":""}" href="#" data-go="calcio/${key}/${k}">${l}</a>`).join("")}</div>`}
    ${body}`);
}

/* ============ ROUTER: calcio / calcio/over50 / calcio/over50/webcup/classifica ============ */
function go(path){
  document.body.classList.remove("gz-on","tt");
  const p=(path||"").split("/");
  window.scrollTo(0,0);
  if(p[0]==="calcio" && CAT[p[1]] && p[2]==="giudice") return giudice(p[1]);
  if(p[0]==="calcio" && CAT[p[1]] && p[2]==="media") return media(p[1]);
  if(p[0]==="calcio" && CAT[p[1]] && p[2]==="regolamento") return regolamento(p[1]);
  if(p[0]==="calcio" && CAT[p[1]] && p[2]==="gazzettino") return gazzettino(p[1],p[3]);
  if(p[0]==="calcio" && CAT[p[1]] && p[2]==="articolo") return articolo(p[1],p[3]);
  if(p[0]==="calcio" && CAT[p[1]] && p[2]==="giocatore") return giocatore(p[1],p.slice(3).join("/"));
  if(p[0]==="calcio" && CAT[p[1]] && p[2]==="totale" && p[3]==="squadra") return squadraTotale(p[1],p.slice(4).join("/"));
  if(p[0]==="calcio" && CAT[p[1]] && DATA[p[1]+"/"+p[2]] && p[3]==="squadra") return squadra(p[1],p[2],p.slice(4).join("/"));
  if(p[0]==="calcio" && CAT[p[1]] && DATA[p[1]+"/"+p[2]]) return competizione(p[1],p[2],p[3]||"risultati");
  if(p[0]==="calcio" && CAT[p[1]]) return categoria(p[1]);
  if(p[0]==="calcio") return calcio();
  if(p[0]==="tennis" && p[1]==="tab" && TENNIS.tabelloni[p[2]]) return tennisTab(p[2]);
  if(p[0]==="tennis" && p[1]==="vista" && TENNIS.tabelloni[p[2]]) return tennisVista(p[2]);
  if(p[0]==="tennis" && p[1]==="anno" && TENNIS.archivio[p[2]]) return tennisAnno(p[2]);
  if(p[0]==="padel"){
    if(p[1]==="master") return padelMaster(p[2]);
    if(p[1]==="oop") return padelOop();
    if(p[1]==="albo") return padelAlbo(p[2]);
    if(p[1]==="regolamento") return padelReg();
    if(PADEL.cat[p[1]]){ const c=p[1];
      if(p[2]==="classifica") return padelClassifica(c,p[3]);
      const m=(p[2]||"").match(/^t(\d)$/); if(m && pTappa(c,m[1])){ if(p[3]==="vista"&&["gold","silver"].includes(p[4])) return padelVista(c,m[1],p[4]); return padelTappa(c,m[1],p[3]); }
      return padelCat(c); }
    return padel();
  }
  if(p[0]==="tennis" && p[1]==="oop") return tennisOop();
  if(p[0]==="tennis" && p[1]==="albo") return tennisAlbo(p[2]);
  if(p[0]==="tennis" && p[1]==="regolamento") return tennisReg();
  if(p[0]==="tennis" && TCAT[p[1]]) return tennisCat(p[1]);
  if(p[0]==="tennis") return tennis();
  home();
}
const NAV=[]; let CURP=(location.hash||"").replace(/^#\/?/,"");
function navTo(path,y){ CURP=path; go(path); try{ history.replaceState(null,"","#/"+path); }catch(_){} window.scrollTo(0,y||0); }
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-go]"); if(!a) return;
  e.preventDefault(); const path=a.getAttribute("data-go");
  if(a.classList.contains("back") && NAV.length){ const pr=NAV.pop(); navTo(pr.p,pr.y); requestAnimationFrame(()=>window.scrollTo(0,pr.y)); return; }
  if(a.classList.contains("back")){ navTo(path,0); return; }
  if(a.classList.contains("home")){ NAV.length=0; navTo("",0); return; }
  if(path===CURP) return;
  NAV.push({p:CURP,y:window.scrollY}); if(NAV.length>60) NAV.shift();
  navTo(path,0);
});
go((location.hash||"").replace(/^#\/?/,""));
</script>
